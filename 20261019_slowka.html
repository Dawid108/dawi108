let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;

let canAnswer = true;

function newGame(){

    life = 9;
    score = 0;
    used = [];
    canAnswer = true;

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}

function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}

function speakAnswer(){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    let text = current.a;

    let utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{

        id =
            Math.floor(
                Math.random() * maxQ
            );

    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];

    canAnswer = true;


    document
        .getElementById("category")
        .innerText = current.cat;


    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    let input =
        document.getElementById("answerInput");

    input.value = "";

    input.disabled = false;

    input.focus();


    document
        .getElementById("checkButton")
        .disabled = false;


    document
        .getElementById("result")
        .innerText = "";


    document
        .getElementById("result")
        .className = "";



    setTimeout(
        () => speakAnswer(),
        300
    );

}

function checkAnswer(){

    if(!canAnswer){
        return;
    }

    let input =
        document.getElementById("answerInput");

    let userAnswer =
        input.value.trim();

    if(userAnswer === ""){
        input.focus();
        return;
    }


    canAnswer = false;

    input.disabled = true;

    document
        .getElementById("checkButton")
        .disabled = true;



    let user =
        userAnswer.toLowerCase();

    let correctAnswer =
        current.a.trim().toLowerCase();


    if(user === correctAnswer){

        correctAnswerAction();

    }else{

        wrongAnswerAction();

    }

}


function correctAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "✅ <b>Poprawnie!</b>";

    document
        .getElementById("result")
        .className =
        "resultCorrect";


    score++;


    dawid108 =
        parseInt(dawid108) + 9;

    localStorage.setItem(
        "dawid108",
        dawid108
    );


    angielski =
        parseInt(angielski) + 9;

    localStorage.setItem(
        "angielski",
        angielski
    );


    updateStats();


    setTimeout(
        () => nextQuestion(),
        1500
    );

}


function wrongAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "❌ <b>Źle!</b><br>" +
        "Poprawna odpowiedź: <strong>" +
        current.a +
        "</strong>";


    document
        .getElementById("result")
        .className =
        "resultWrong";


    life--;

    updateStats();


    setTimeout(
        () => speakAnswer(),
        500
    );


    if(life <= 0){

        setTimeout(
            () => gameOver(),
            6000
        );

    }else{

        setTimeout(
            () => nextQuestion(),
            5000
        );

    }

}


document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                checkAnswer();
            }

        }
    );


function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}



function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>
