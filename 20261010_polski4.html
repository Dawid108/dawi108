<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

// 4. Zjawy i bohaterowie
{cat:"Polski", q:"Komu ukazuje się Widmo?", a:"Marysi", b:"Dziennikarzowi", c:"Poecie", d:"Gospodarzowi"},
{cat:"Polski", q:"Komu ukazuje się Stańczyk?", a:"Dziennikarzowi", b:"Marysi", c:"Panu Młodemu", d:"Dziadowi"},
{cat:"Polski", q:"Komu ukazuje się Rycerz, czyli Zawisza Czarny?", a:"Poecie", b:"Gospodarzowi", c:"Marysi", d:"Czepcowi"},
{cat:"Polski", q:"Komu ukazuje się Hetman, czyli Franciszek Ksawery Branicki?", a:"Panu Młodemu", b:"Dziennikarzowi", c:"Poecie", d:"Gospodarzowi"},
{cat:"Polski", q:"Komu ukazuje się Upiór, czyli Jakub Szela?", a:"Dziadowi", b:"Marysi", c:"Czepcowi", d:"Panu Młodemu"},
{cat:"Polski", q:"Komu ukazuje się Wernyhora?", a:"Gospodarzowi", b:"Dziennikarzowi", c:"Poecie", d:"Marysi"},
{cat:"Polski", q:"Komu ukazuje się Chochoł na początku?", a:"Isi", b:"Czepcowi", c:"Dziennikarzowi", d:"Panu Młodemu"},
{cat:"Polski", q:"Co symbolizuje Widmo ukazujące się Marysi?", a:"Dawną miłość i wspomnienia przeszłości", b:"Zdradę narodową i winy polskiej szlachty", c:"Mądrość polityczną i wyrzuty sumienia inteligencji", d:"Wezwanie do zorganizowania powstania narodowego"},
{cat:"Polski", q:"Co symbolizuje Stańczyk?", a:"Mądrość polityczną i wyrzuty sumienia inteligencji", b:"Wyłącznie chłopskie przywiązanie do własności", c:"Romantyczną miłość i wspomnienia Marysi", d:"Nadzieję na odrodzenie ukrytą w słomianym chochole"},
{cat:"Polski", q:"Co symbolizuje Rycerz ukazujący się Poecie?", a:"Siłę, honor i gotowość do walki", b:"Zdradę narodową i winy dawnej szlachty", c:"Historyczne krzywdy chłopów podczas rabacji", d:"Brak odpowiedzialności za utratę złotego rogu"},
{cat:"Polski", q:"Co symbolizuje Hetman?", a:"Zdradę narodową i winy szlachty", b:"Siłę, honor i gotowość do walki", c:"Nadzieję na odrodzenie i wiosenne przebudzenie", d:"Mądrość polityczną oraz odpowiedzialność inteligencji"},
{cat:"Polski", q:"Co przypomina Upiór ukazujący się Dziadowi?", a:"Rabację galicyjską i konflikt chłopów ze szlachtą", b:"Dawną miłość Marysi i jej wspomnienia", c:"Misję powstańczą powierzoną Gospodarzowi", d:"Polityczne wyrzuty sumienia Dziennikarza"},
{cat:"Polski", q:"Co przynosi Wernyhora Gospodarzowi?", a:"Wezwanie do narodowego powstania", b:"Przypomnienie o dawnej miłości Marysi", c:"Ostrzeżenie przed historyczną zdradą szlachty", d:"Polecenie zatańczenia z pozostałymi weselnikami"},
{cat:"Polski", q:"Co robi Chochoł w zakończeniu dramatu?", a:"Doprowadza do chocholego tańca weselników", b:"Organizuje udane powstanie i odzyskanie niepodległości", c:"Przekazuje Dziennikarzowi złoty róg i kaduceusz", d:"Przywraca złotą podkowę i godzi wszystkie grupy"},
{cat:"Polski", q:"Jakie zadanie otrzymuje Gospodarz od Wernyhory?", a:"Zorganizować ludzi i przygotować wezwanie do powstania", b:"Przekazać Stańczykowi kaduceusz i zakończyć wesele", c:"Odnaleźć Widmo i pogodzić je z Marysią", d:"Zatrzymać taniec Chochoła i oddać czapkę Jaśkowi"},
{cat:"Polski", q:"Kim był Jakub Szela?", a:"Przywódcą chłopskiego wystąpienia podczas rabacji galicyjskiej", b:"Przywódcą polskiego powstania w Bronowicach", c:"Poetą, któremu ukazał się Zawisza Czarny", d:"Dziennikarzem rozmawiającym z Czepcem o polityce"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 10;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
