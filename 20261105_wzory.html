<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [
  {
    cat: "Matematyka",
    q: "Jaki jest warunek na ciąg rosnący przedstawiony w notatkach?",
    a: "a_{n+1} > a_n",
    b: "a_{n+1} < a_n",
    c: "a_{n+1} = a_n",
    d: "a_{n+1} \geq a_n"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest warunek na ciąg malejący przedstawiony w notatkach?",
    a: "a_{n+1} < a_n",
    b: "a_{n+1} > a_n",
    c: "a_{n+1} = a_n",
    d: "a_{n+1} \leq a_n"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest warunek na ciąg stały przedstawiony w notatkach?",
    a: "a_{n+1} = a_n",
    b: "a_{n+1} > a_n",
    c: "a_{n+1} < a_n",
    d: "a_{n+1} \neq a_n"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na n-ty wyraz ciągu arytmetycznego?",
    a: "a_n = a_1 + (n-1) \\cdot r",
    b: "a_n = a_1 \\cdot q^{n-1}",
    c: "a_n = a_1 + (n+1) \\cdot r",
    d: "a_n = a_1 - (n-1) \\cdot r"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na sumę n początkowych wyrazów ciągu arytmetycznego?",
    a: "S_n = \\frac{a_1 + a_n}{2} \\cdot n",
    b: "S_n = a_1 \\cdot \\frac{1-q^n}{1-q}",
    c: "S_n = \\frac{a_1 - a_n}{2} \\cdot n",
    d: "S_n = \\frac{a_1 + a_n}{n} \\cdot 2"
  },
  {
    cat: "Matematyka",
    q: "Jaka jest własność trzech kolejnych wyrazów ciągu arytmetycznego?",
    a: "b = \\frac{a+c}{2}",
    b: "b^2 = a \\cdot c",
    c: "b = \\frac{a-c}{2}",
    d: "b = a \\cdot c \\cdot 2"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na n-ty wyraz ciągu geometrycznego?",
    a: "a_n = a_1 \\cdot q^{n-1}",
    b: "a_n = a_1 + (n-1) \\cdot r",
    c: "a_n = a_1 \\cdot q^{n+1}",
    d: "a_n = a_1 \\cdot n^{q-1}"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na sumę n początkowych wyrazów ciągu geometrycznego?",
    a: "S_n = a_1 \\cdot \\frac{1-q^n}{1-q}",
    b: "S_n = \\frac{a_1 + a_n}{2} \\cdot n",
    c: "S_n = a_1 \\cdot \\frac{1+q^n}{1+q}",
    d: "S_n = a_n \\cdot \\frac{1-q^n}{1-q}"
  },
  {
    cat: "Matematyka",
    q: "Jaka jest własność trzech kolejnych wyrazów ciągu geometrycznego?",
    a: "b^2 = a \\cdot c",
    b: "b = \\frac{a+c}{2}",
    c: "b = a^2 \\cdot c",
    d: "b^2 = a + c"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na kapitalizację prostą (prosta)?",
    a: "K_n = k_0 \\cdot (1 + p \\cdot \\frac{n}{100})",
    b: "K_n = k_0 \\cdot (1 + \\frac{n}{100})^m",
    c: "K_n = k_0 \\cdot (1 - p \\cdot \\frac{n}{100})",
    d: "K_n = k_0 \\cdot (p + \\frac{n}{100})^m"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na kapitalizację roczną?",
    a: "K_n = k_0 \\cdot (1 + \\frac{n}{100})^m",
    b: "K_n = k_0 \\cdot (1 + p \\cdot \\frac{n}{100})",
    c: "K_n = k_0 \\cdot (1 - \\frac{n}{100})^m",
    d: "K_n = k_0 \\cdot (1 + \\frac{m}{100})^n"
  },
  {
    cat: "Matematyka",
    q: "Jaki jest wzór na kapitalizację m razy w roku?",
    a: "K_n = k_0 \\cdot (1 + \\frac{1}{m \\cdot 100})^{m}",
    b: "K_n = k_0 \\cdot (1 + \\frac{n}{100})^m",
    c: "K_n = k_0 \\cdot (1 - \\frac{1}{m \\cdot 100})^{m}",
    d: "K_n = k_0 \\cdot (1 + \\frac{m}{100} \\cdot n)"
  }
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let matematyka =
    localStorage.getItem("matematyka") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 11;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        matematyka =
            parseInt(matematyka) + 11;

        localStorage.setItem(
            "matematyka",
            matematyka
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
