<body>

<div id="game">

    <div id="stats">
        <div>Życia: <span id="life">9</span></div>
        <div>Punkty: <span id="score">0</span></div>
    </div>

    <div class="category" id="category"></div>

    <div class="question" id="question"></div>

    <!-- WPISYWANIE ODPOWIEDZI -->
    <div id="answers">

        <input
            type="text"
            id="answerInput"
            placeholder="Wpisz słówko po angielsku"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <button
            id="checkButton"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>

    </div>

    <div id="result"></div>

    <div id="counter"></div>

</div>


<div id="endScreen" class="hidden">

    <h2 id="endTitle"></h2>

    <p>
        Twój wynik:
        <span id="finalScore"></span>
    </p>

    <p>
        Twój rekord:
        <span id="record"></span>
    </p>

    <p>
        Suma punktów:
        <span id="dawid108"></span>
    </p>

    <button onclick="newGame()">
        Nowa Gra
    </button>

</div>

  {cat:"Angielski", q:"badanie", a:"examination", b:"bulimia", c:"feel sick", d:"treat"},
  {cat:"Angielski", q:"zaspokajać nałóg", a:"feed addiction", b:"examination", c:"easy way out", d:"check-up"},
  {cat:"Angielski", q:"hazard", a:"gambling", b:"caffeine", c:"health centre", d:"chemist's"},

  {cat:"Angielski", q:"hospicjum", a:"hospice", b:"feel ill", c:"bulimia", d:"easy way out"},
  {cat:"Angielski", q:"całkowicie wyzdrowieć / przyspieszyć całkowite wyzdrowienie", a:"make/speed up a full recovery", b:"give up compulsive gaming", c:"obsess over unnecessary details", d:"damaging coping strategy"},
  {cat:"Angielski", q:"gry online", a:"online gaming", b:"operating theatre", c:"examination", d:"addictive"},

  {cat:"Angielski", q:"zaburzenie snu", a:"sleeping disorder", b:"put your life at risk", c:"feel unwell", d:"glued to the screen"},
  {cat:"Angielski", q:"lunatyk/lunatyczka", a:"sleepwalker", b:"anorexia", c:"bulimia", d:"addiction"},
  {cat:"Angielski", q:"choroba", a:"disease", b:"home visit", c:"bulimia", d:"sleepwalker"},
  {cat:"Angielski", q:"zamartwiać się, przejmować się problemami", a:"dwell on problems", b:"eating disorder", c:"sleepwalker", d:"glued to the screen"},
  {cat:"Angielski", q:"paść ofiarą czegoś", a:"fall victim to sth", b:"sleeping disorder", c:"glued to the screen", d:"easy way out"},
  {cat:"Angielski", q:"źle się czuć", a:"feel ill", b:"chemist's", c:"counsellor", d:"injure"},
  {cat:"Angielski", q:"źle się czuć, mieć mdłości", a:"feel sick", b:"sickness", c:"addiction", d:"surgeon"},
  {cat:"Angielski", q:"źle się czuć", a:"feel unwell", b:"disease", c:"take medicines", d:"treat"},
  {cat:"Angielski", q:"leczyć, goić się", a:"heal", b:"addictive", c:"check-up", d:"chemist's"},
  {cat:"Angielski", q:"zranić, boleć; ranny", a:"hurt", b:"X-ray", c:"sickness", d:"counsellor"},
  {cat:"Angielski", q:"choroba", a:"illness", b:"feel unwell", c:"easy way out", d:"cure"},
  {cat:"Angielski", q:"zranić", a:"injure", b:"addiction", c:"gambling", d:"addictive"},
  {cat:"Angielski", q:"przejmować się nieistotnymi szczegółami", a:"obsess over unnecessary details", b:"take preventative measures", c:"suffer/sustain minor injuries", d:"make/speed up a full recovery"},
  {cat:"Angielski", q:"doprowadzić się do sytuacji zagrożenia życia", a:"put your life at risk", b:"dwell on problems", c:"glued to the screen", d:"operating theatre"},
  {cat:"Angielski", q:"choroba", a:"sickness", b:"take medicines", c:"home visit", d:"easy way out"},
  {cat:"Angielski", q:"odciskać swoje piętno na", a:"take its toll on", b:"operating theatre", c:"beat one's mood swings", d:"counsellor"},
  {cat:"Angielski", q:"przewracać się z boku na bok w łóżku", a:"toss and turn in bed", b:"beat one's mood swings", c:"put your life at risk", d:"show dependence on"},
  {cat:"Angielski", q:"leczyć", a:"treat", b:"surgery", c:"anorexia", d:"caffeine"},
  {cat:"Angielski", q:"zranić; rana", a:"wound", b:"examination", c:"feel sick", d:"feel unwell"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;

let canAnswer = true;

function newGame(){

    life = 9;
    score = 0;
    used = [];
    canAnswer = true;

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}

function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}

function speakAnswer(){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    let text = current.a;

    let utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{

        id =
            Math.floor(
                Math.random() * maxQ
            );

    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];

    canAnswer = true;


    document
        .getElementById("category")
        .innerText = current.cat;


    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    let input =
        document.getElementById("answerInput");

    input.value = "";

    input.disabled = false;

    input.focus();


    document
        .getElementById("checkButton")
        .disabled = false;


    document
        .getElementById("result")
        .innerText = "";


    document
        .getElementById("result")
        .className = "";



    setTimeout(
        () => speakAnswer(),
        300
    );

}

function checkAnswer(){

    if(!canAnswer){
        return;
    }

    let input =
        document.getElementById("answerInput");

    let userAnswer =
        input.value.trim();

    if(userAnswer === ""){
        input.focus();
        return;
    }


    canAnswer = false;

    input.disabled = true;

    document
        .getElementById("checkButton")
        .disabled = true;



    let user =
        userAnswer.toLowerCase();

    let correctAnswer =
        current.a.trim().toLowerCase();


    if(user === correctAnswer){

        correctAnswerAction();

    }else{

        wrongAnswerAction();

    }

}


function correctAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "✅ <b>Poprawnie!</b>";

    document
        .getElementById("result")
        .className =
        "resultCorrect";


    score++;


    dawid108 =
        parseInt(dawid108) + 9;

    localStorage.setItem(
        "dawid108",
        dawid108
    );


    angielski =
        parseInt(angielski) + 9;

    localStorage.setItem(
        "angielski",
        angielski
    );


    updateStats();


    setTimeout(
        () => nextQuestion(),
        1500
    );

}


function wrongAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "❌ <b>Źle!</b><br>" +
        "Poprawna odpowiedź: <strong>" +
        current.a +
        "</strong>";


    document
        .getElementById("result")
        .className =
        "resultWrong";


    life--;

    updateStats();


    setTimeout(
        () => speakAnswer(),
        500
    );


    if(life <= 0){

        setTimeout(
            () => gameOver(),
            6000
        );

    }else{

        setTimeout(
            () => nextQuestion(),
            5000
        );

    }

}


document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                checkAnswer();
            }

        }
    );


function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}



function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
