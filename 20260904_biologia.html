<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

    q: "Co jest łącznikiem pomiędzy gruczołami dokrewnymi w organizmie?",
    a: "Układ krwionośny",
    b: "Układ limfatyczny",
    c: "Układ nerwowy",
    d: "Układ pokarmowy"
  },
  {
    cat: "Biologia",
    q: "Przez co regulowana jest praca układu hormonalnego?",
    a: "Przez układ nerwowy za pośrednictwem podwzgórza",
    b: "Przez układ pokarmowy za pośrednictwem żołądka",
    c: "Przez układ krwionośny za pośrednictwem serca",
    d: "Przez układ oddechowy za pośrednictwem płuc"
  },
  {
    cat: "Biologia",
    q: "Jaki hormon wydziela szyszynka?",
    a: "Melatoninę",
    b: "Kortyzol",
    c: "Tymozynę",
    d: "Trokscynę"
  },
  {
    cat: "Biologia",
    q: "Czym jest podwzgórze i jaka jest jego funkcja?",
    a: "To część mózgowia, która łączy układ nerwowy z układem hormonalnym i steruje funkcją wydzielniczą przysadki",
    b: "To narząd jamy brzusznej, który reguluje poziom glukozy i wspomaga pracę trzustki oraz wątroby",
    c: "To gruczoł szyjny, który bezpośrednio kontroluje tempo przemiany materii oraz gospodarkę wapniową",
    d: "To element rdzenia kręgowego, który odpowiada za łuk odruchowy i przekazywanie impulsów ruchowych"
  },
  {
    cat: "Biologia",
    q: "Jakie hormony wytwarza podwzgórze, które są transportowane do przysadki?",
    a: "Hormon antydiuretyczny i oksytocynę",
    b: "Insulinę oraz glukagon",
    c: "Tymozynę oraz tyroksynę",
    d: "Kortyzol oraz adrenalinę"
  },
  {
    cat: "Biologia",
    q: "Jakie hormony wydziela przysadka?",
    a: "Hormony tropowe oraz prolaktynę i hormon wzrostu",
    b: "Hormony tarczycowe oraz tyroksynę i kalcytoninę",
    c: "Hormony nadnerczowe oraz kortyzol i adrenalinę",
    d: "Hormony płciowe oraz testosteron i estrogeny"
  },
  {
    cat: "Biologia",
    q: "Jaką dodatkową rolę pełni przysadka wobec hormonów wytwarzanych przez podwzgórze?",
    a: "Magazynuje je i uwalnia",
    b: "Neutralizuje je i usuwa",
    c: "Syntezuje je i rozkłada",
    d: "Filtruje je i wchłania"
  },
  {
    cat: "Biologia",
    q: "Jakie hormony wydziela tarczyca?",
    a: "Tyroksynę, trójjodotyroninę i kalcytoninę",
    b: "Parathormon, insulinę i glukagon",
    c: "Melatoninę, prolaktynę i tymozynę",
    d: "Kortyzol, adrenalinę i estrogeny"
  },
  {
    cat: "Biologia",
    q: "Jaki hormon wydzielają przytarczyce?",
    a: "Parathormon",
    b: "Kalcytoninę",
    c: "Testosteron",
    d: "Prolaktynę"
  },
  {
    cat: "Biologia",
    q: "Jaki hormon wydziela grasica?",
    a: "Tymozynę",
    b: "Melatoninę",
    c: "Adrenalinę",
    d: "Glukagon"
  },
  {
    cat: "Biologia",
    q: "Z jakich części są zbudowane nadnercza?",
    a: "Z kory i rdzenia",
    b: "Z trzonu i głowy",
    c: "Z pęcherzyków i przewodów",
    d: "Z przedniego i tylnego płata"
  },
  {
    cat: "Biologia",
    q: "Co wydziela kora nadnerczy, a co rdzeń nadnerczy?",
    a: "Kora wydziela m.in. kortyzol, a rdzeń – adrenalinę",
    b: "Kora wydziela m.in. insulinę, a rdzeń – glukagon",
    c: "Kora wydziela m.in. tyroksynę, a rdzeń – kalcytoninę",
    d: "Kora wydziela m.in. tymozynę, a rdzeń – melatoninę"
  },
  {
    cat: "Biologia",
    q: "Jakie hormony wydziela trzustka?",
    a: "Insulinę oraz glukagon",
    b: "Tyroksynę oraz kortyzol",
    c: "Prolaktynę oraz melatoninę",
    d: "Testosteron oraz estrogeny"
  },
  {
    cat: "Biologia",
    q: "Jaki hormon wydzielają jądra?",
    a: "Testosteron",
    b: "Progesteron",
    c: "Estrogen",
    d: "Kortyzol"
  },
  {
    cat: "Biologia",
    q: "Jakie hormony wydzielają jajniki?",
    a: "Estrogeny oraz progesteron",
    b: "Testosteron oraz androsteron",
    c: "Insulinę oraz glukagon",
    d: "Tyroksynę oraz tymozynę"
  }





];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let biologia =
    localStorage.getItem("biologia") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 9;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        biologia =
            parseInt(biologia) + 9;

        localStorage.setItem(
            "biologia",
            biologia
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
