<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

// 2. Konflikt chłopów i inteligencji
{cat:"Polski", q:"Jaki był pierwszy powód konfliktu chłopów i inteligencji?", a:"Uprzedzenia historyczne związane z krzywdami wyrządzonymi chłopom", b:"Różnice wynikające wyłącznie z wyznawanej religii", c:"Niechęć chłopów do wszystkich zagranicznych podróży", d:"Spór o podział pieniędzy z weselnej zabawy"},
{cat:"Polski", q:"Jaki był drugi powód konfliktu chłopów i inteligencji?", a:"Różnice poglądów i powierzchowne idealizowanie wsi przez inteligencję", b:"Całkowity brak zainteresowania polityką u wszystkich chłopów", c:"Jednakowe poglądy obu grup na sprawy społeczne", d:"Spór o to, kto powinien organizować weselne tańce"},
{cat:"Polski", q:"Jaki był trzeci powód konfliktu chłopów i inteligencji?", a:"Brak jedności i wzajemnego zaufania", b:"Nadmierne zainteresowanie chłopów zagranicznymi podróżami", c:"Wspólna niechęć do wszystkich polskich tradycji", d:"Brak jakichkolwiek różnic w poglądach obu grup"},
{cat:"Polski", q:"Co pokazuje rozmowa Czepca z Dziennikarzem?", a:"Chłop interesuje się polityką, ale inteligent go lekceważy", b:"Inteligent prosi chłopa o pomoc w zorganizowaniu powstania", c:"Obaj bohaterowie zgadzają się we wszystkich sprawach politycznych", d:"Chłop nie chce rozmawiać o wydarzeniach w innych krajach"},
{cat:"Polski", q:"Dlaczego chłopi nie ufali szlachcie?", a:"Pamiętali historyczne krzywdy i konflikty społeczne", b:"Uważali, że szlachta nie zna żadnych polskich tradycji", c:"Nie chcieli uczestniczyć w żadnych uroczystościach weselnych", d:"Uważali, że inteligencja nie potrafi mówić po polsku"},
{cat:"Polski", q:"Jak inteligencja często przedstawiała wieś?", a:"Idealizowała ją i nie rozumiała wszystkich problemów chłopów", b:"Przedstawiała ją wyłącznie jako miejsce walk i powstań", c:"Uważała ją za miejsce pozbawione jakichkolwiek tradycji", d:"Opisywała ją jako środowisko całkowicie obojętne politycznie"},
{cat:"Polski", q:"Co oznacza chłopomania?", a:"Fascynację wsią i kulturą chłopską, czasem powierzchowną", b:"Całkowite odrzucenie kultury ludowej przez inteligencję", c:"Niechęć chłopów do wszystkich dawnych polskich tradycji", d:"Polityczny plan natychmiastowego rozpoczęcia powstania"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 10;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
