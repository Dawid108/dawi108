<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turniej Play-Off (256 Drużyn)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #38bdf8;
            width: 0%;
            transition: width 0.3s ease;
        }

        #container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        .match-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        .team-btn {
            background: #334155;
            color: #ffffff;
            border: 2px solid transparent;
            padding: 16px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
            line-height: 1.2;
        }

        .team-btn:active {
            transform: scale(0.98);
            background: #0284c7;
            border-color: #38bdf8;
        }

        .vs-badge {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .winner-screen {
            text-align: center;
            background: #1e293b;
            padding: 24px 16px;
            border-radius: 16px;
            border: 2px solid #f59e0b;
        }

        .trophy {
            font-size: 3.5rem;
            margin-bottom: 8px;
        }

        .winner-title {
            color: #f59e0b;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .winner-name {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 20px;
            padding: 10px;
            background: #334155;
            border-radius: 8px;
        }

        .action-btn {
            background: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }

        .reset-btn {
            background: #ef4444;
            color: #ffffff;
        }

        .action-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="stage-title">Runda 1</h1>
        <div class="subtitle" id="match-counter">Mecz 1 z 128</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
    </header>

    <div id="container"></div>

    <script>
        const initialTeams = [
            "Lech Poznań", "AC Milan", "Barcelona", "Inter", "Chelsea", "Juventus", "Legia Warszawa", "Arsenal",
            "Tottenham", "Błyskawica", "Atalanta", "Sturm Graz", "Dinamo Zagrzeb", "Pafos", "Slavia Praga", "Sparta Praga",
            "Girona", "VfB Stuttgart", "RB Lipsk", "Śląsk Wrocław", "Piast Gliwice", "Crvena zvezda", "Slovan Bratysława", "Young Boys",
            "Szachtar", "Como", "Crystal Palace", "FC Viktoria Pilzno", "SC Freiburg", "Wisła Kraków", "Lyon", "Brann",
            "Austria Wiedeń", "Rapid Wiedeń", "Lechia Gdańsk", "Arka Gdynia", "Ruch Chorzów", "Miedź Legnica", "Polonia Warszawa", "ŁKS Łódź",
            "Warta Poznań", "Bruk-Bet T.", "Jagiellonia Białystok", "Cracovia", "Zagłębie Lubin", "Górnik Zabrze", "Raków Częstochowa", "Pogoń Szczecin",
            "Korona Kielce", "Widzew Łódź", "Wisła Płock", "GKS Katowice", "Dynamo Kijów", "Motor Lublin", "Radomiak Radom", "Wieczysta Kraków",
            "Omonia", "Vaduz", "Thun", "Hajduk Split", "Lugano", "AEK Larnaka", "Apollon", "Al Ahly",
            "Vojvodina", "Partizan", "Spartak Trnawa", "St. Gallen", "Ferencvaros", "GKS Bełchatów", "Groclin Grodzisk Wlkp.", "Odra Wodzisław",
            "Podbeskidzie B-B", "Stal Mielec", "Polonia Bytom", "Zawisza Bydgoszcz", "Górnik Łęczna", "Sandecja Nowy Sącz", "Zagłębie Sosnowiec", "Astra Krotoszyn",
            "Brentford", "FC Augsburg", "TSG Hoffenheim", "Zilina", "Basel", "Zurich", "Torino", "APOEL",
            "Aris", "Jablonec", "Strasbourg", "Molde", "Maritimo", "Nacional", "Sion", "Malmo FF",
            "Andorra", "Inter Escaldes", "Egnatia", "Sutjeska", "Zamalek", "Żalgiris Kowno", "Vardar", "Floriana",
            "Al Seeb", "Mjallby", "Club Africain", "Gyor", "Fulham", "West Ham", "Millwall", "Charlton",
            "QPR", "Ipswich", "Banik Ostrawa", "Espanyol", "Puszcza Niepołomice", "Odra Opole", "Chrobry Głogów", "Pogoń Siedlce",
            "Stal Rzeszów", "Unia Skierniewice", "Alanyaspor", "Antalyaspor", "St. Pauli", "Union Berlin", "Pogoń Grodzisk Mazowiecki", "Esperance Tunis",
            "UE Santa Coloma", "FC Rangers", "AF Elbasani", "Vllaznia", "Varazdin", "Mornar", "Petrovac", "Pyramids",
            "Eschen/Mauren", "Hegelmann", "Shkendija", "Struga", "Marsaxlokk", "Hamrun", "Al-Shabab", "Al Nasr",
            "Dunajska Streda", "GAIS", "CS Sfaxien", "ŁNZ Czerkasy", "Polissia Żytomierz", "Paks", "Luton", "1. FC Nurnberg",
            "Hertha Berlin", "Chojniczanka", "GKS Tychy", "Stal Stalowa Wola", "Olimpia Grudziądz", "Znicz Pruszków", "Resovia Rzeszów", "Lechia Zielona Góra",
            "Rekord Bielsko-Biała", "Świt Szczecin", "Hutnik Kraków", "Avia Świdnik", "Podhale Nowy Targ", "Sokół Kleczew", "Sigma Ołomuniec", "Monastir",
            "Dinamo City", "FC Santa Coloma", "Atletic Escaldes", "Decic", "Hradec Kralove", "Ceramica Cleopatra", "Sileks", "Valletta",
            "Zeleznicar Pancevo", "Goteborg", "Wigry Suwałki", "Błękitni Stargard", "Flota Świnoujście", "KKS Kalisz", "KSZO Ostrowiec", "Stilon Gorzów",
            "Olimpia Elbląg", "Świt Nowy Dwór", "MKS Kluczbork", "Siarka Tarnobrzeg", "Wda Świecie", "Hetman Zamość", "Pelikan Łowicz", "ROW Rybnik",
            "Olimpia Zambrów", "Polonia Środa Wlkp.", "Chełmianka Chełm", "Ślęza Wrocław", "Stal Brzeg", "Zakynthos", "Bytovia Bytów", "Stomil Olsztyn",
            "Ruch Zdzieszowice", "GKS Jastrzębie", "Dolcan Ząbki", "Gryf Wejherowo", "Stal Sanok", "Okocimski Brzesko", "Rozwój Katowice", "Start Otwock",
            "Wisła Puławy", "Promień Opalenica", "Kmita Zabierzów", "Nielba Wągrowiec", "Limanovia", "Górnik Wałbrzych", "Ostrovia Ostrów Wlkp.", "Wisła Sandomierz",
            "Unia Janikowo", "Jeziorak Iława", "Victoria Koronowo", "Pogoń Oleśnica", "Dąb Dębno", "Polonia Słubice", "Piast Kobylin", "Piotrków Trybunalski",
            "Ruch Radzionków", "Luboński", "Ursus Warszawa", "Sokół Ostróda", "Legionowo", "Huragan Morąg", "Starogard Gdański", "Garbarnia Kraków",
            "Carina Gubin", "Biały Orzeł Koźmin Wlkp.", "Wisła Borek Wlkp.", "Jarota Jarocin", "Sokół Chwaliszew", "Raszkowianka Raszków", "Dobroczanka Pępowo", "Stal Pleszew",
            "Prosna Kalisz", "Calisia Kalisz", "Plon Gądkowice", "Pogoń Cieszków", "Grom Czeluścin", "CKS Zduny", "Sparta Miejsca Górka", "Awdaniec Pakosław",
            "Grom Golina", "Czarni Dobrzyca", "Pogoń Nowe Skalmierzyce", "Gladiatorzy Pieruszyce", "Victoria Skarszew", "Czarni Wierzbno", "GKS Żerków", "Błękitni Chruszczyny"
        ];

        let currentRoundTeams = [];
        let nextRoundTeams = [];
        let currentMatchIndex = 0;

        function saveState() {
            const state = {
                currentRoundTeams,
                nextRoundTeams,
                currentMatchIndex
            };
            localStorage.setItem("tournamentState", JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem("tournamentState");
            if (saved) {
                const state = JSON.parse(saved);
                currentRoundTeams = state.currentRoundTeams;
                nextRoundTeams = state.nextRoundTeams;
                currentMatchIndex = state.currentMatchIndex;
            } else {
                startNewTournament();
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startNewTournament() {
            currentRoundTeams = shuffle([...initialTeams]);
            nextRoundTeams = [];
            currentMatchIndex = 0;
            saveState();
            updateUI();
        }

        function getStageName(teamsCount) {
            switch (teamsCount) {
                case 256: return "1/128 Finału";
                case 128: return "1/64 Finału";
                case 64: return "1/32 Finału";
                case 32: return "1/16 Finału";
                case 16: return "1/8 Finału";
                case 8: return "Ćwierćfinał";
                case 4: return "Półfinał";
                case 2: return "Finał";
                default: return "Turniej";
            }
        }

        function updateUI() {
            const container = document.getElementById("container");
            const stageTitle = document.getElementById("stage-title");
            const matchCounter = document.getElementById("match-counter");
            const progress = document.getElementById("progress");

            const totalMatchesInRound = currentRoundTeams.length / 2;

            if (currentRoundTeams.length === 1) {
                stageTitle.textContent = "Koniec Turnieju!";
                matchCounter.textContent = "Mamy zwycięzcę!";
                progress.style.width = "100%";

                container.innerHTML = `
                    <div class="winner-screen">
                        <div class="trophy">🏆</div>
                        <div class="winner-title">ZWYCIĘZCA PUCHARU</div>
                        <div class="winner-name">${currentRoundTeams[0]}</div>
                        <button class="action-btn" onclick="startNewTournament()">Zagraj Nowy Turniej</button>
                    </div>
                `;
                return;
            }

            stageTitle.textContent = getStageName(currentRoundTeams.length);
            matchCounter.textContent = `Mecz ${currentMatchIndex + 1} z ${totalMatchesInRound}`;

            const percent = (currentMatchIndex / totalMatchesInRound) * 100;
            progress.style.width = `${percent}%`;

            const teamA = currentRoundTeams[currentMatchIndex * 2];
            const teamB = currentRoundTeams[currentMatchIndex * 2 + 1];

            container.innerHTML = `
                <div class="match-card">
                    <button class="team-btn" onclick="pickWinner(${currentMatchIndex * 2})">
                        <span>${teamA}</span>
                        <span>➔</span>
                    </button>
                    <div class="vs-badge">VS</div>
                    <button class="team-btn" onclick="pickWinner(${currentMatchIndex * 2 + 1})">
                        <span>${teamB}</span>
                        <span>➔</span>
                    </button>
                </div>
                <button class="action-btn reset-btn" onclick="startNewTournament()">Rozpocznij Nowy Turniej</button>
            `;
        }

        function pickWinner(teamIndex) {
            nextRoundTeams.push(currentRoundTeams[teamIndex]);
            currentMatchIndex++;

            const totalMatchesInRound = currentRoundTeams.length / 2;

            if (currentMatchIndex >= totalMatchesInRound) {
                currentRoundTeams = [...nextRoundTeams];
                nextRoundTeams = [];
                currentMatchIndex = 0;
            }

            saveState();
            updateUI();
        }

        loadState();
        updateUI();
    </script>
</body>
</html>
