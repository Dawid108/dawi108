<body>

<div id="game">

    <div id="stats">
        <div>Życia: <span id="life">9</span></div>
        <div>Punkty: <span id="score">0</span></div>
    </div>

    <div class="category" id="category"></div>

    <div class="question" id="question"></div>

    <!-- WPISYWANIE ODPOWIEDZI -->
    <div id="answers">

        <input
            type="text"
            id="answerInput"
            placeholder="Wpisz słówko po angielsku"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <button
            id="checkButton"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>

    </div>

    <div id="result"></div>

    <div id="counter"></div>

</div>


<div id="endScreen" class="hidden">

    <h2 id="endTitle"></h2>

    <p>
        Twój wynik:
        <span id="finalScore"></span>
    </p>

    <p>
        Twój rekord:
        <span id="record"></span>
    </p>

    <p>
        Suma punktów:
        <span id="dawid108"></span>
    </p>

    <button onclick="newGame()">
        Nowa Gra
    </button>

</div>

  {cat:"Angielski", q:"prywatny nauczyciel/nauczycielka, korepetytor/korepetytorka online", a:"online tutor", b:"remote mentor", c:"virtual instructor", d:"digital teacher"},
  {cat:"Angielski", q:"dane osobowe", a:"personal data", b:"private info", c:"user details", d:"person facts"},
  {cat:"Angielski", q:"cechy osobowe", a:"personal qualities", b:"character traits", c:"individual features", d:"personal skills"},

  {cat:"Angielski", q:"wykwalifikowany, uzdolniony, wprawny", a:"skilled", b:"trained", c:"capable", d:"talented"},
  {cat:"Angielski", q:"stresujący", a:"stressful", b:"tiring", c:"painful", d:"hectic"},
  {cat:"Angielski", q:"niewykwalifikowany", a:"unskilled", b:"untrained", c:"raw-hand", d:"no-skill"},

  {cat:"Angielski", q:"umysłowy, biurowy", a:"white-collar", b:"desk-worked", c:"office-bound", d:"paper-based"},
  {cat:"Angielski", q:"wystarczający; dosyć, aż nadto", a:"ample", b:"enough", c:"plenty", d:"fairly"},
  {cat:"Angielski", q:"sumienny", a:"conscientious", b:"scrupulous", c:"meticulous", d:"deliberate"},
  {cat:"Angielski", q:"stanowisko, posada", a:"post", b:"role", c:"seat", d:"spot"},
  {cat:"Angielski", q:"dążenie", a:"pursuit", b:"desire", c:"intent", d:"action"},
  {cat:"Angielski", q:"być do czegoś stworzonym", a:"be cut out to do sth", b:"be born to handle sth", c:"be made to do anything", d:"be fit for doing sth"},
  {cat:"Angielski", q:"mieć rozpaczliwą potrzebę, desperacko potrzebować", a:"be in desperate need of", b:"be in urgent search for", c:"be in grave problem with", d:"be in strong desire for"},
  {cat:"Angielski", q:"nie być czegoś świadomym", a:"be unaware of", b:"be ignorant to", c:"be unmindful in", d:"be blind to it"},
  {cat:"Angielski", q:"zatrudnić, używać", a:"employ", b:"engage", c:"retain", d:"enlist"},
  {cat:"Angielski", q:"spróbować", a:"give it a go", b:"make a try", c:"take a risk", d:"have a run"},
  {cat:"Angielski", q:"ziemia; wylądować", a:"land", b:"soil", c:"site", d:"drop"},
  {cat:"Angielski", q:"znaleźć pracę", a:"land a job", b:"find a role", c:"get a post", d:"seek a work"},
  {cat:"Angielski", q:"wiązać koniec z końcem", a:"make ends meet", b:"keep money safe", c:"hold costs low", d:"pay off debts"},
  {cat:"Angielski", q:"przesunąć, poruszyć, wzruszyć", a:"move", b:"push", c:"shift", d:"stir"},
  {cat:"Angielski", q:"wystawiać (sztukę), wykonywać zadania", a:"perform", b:"execute", c:"present", d:"fulfil"},
  {cat:"Angielski", q:"biegać, zarządzać, prowadzić", a:"run", b:"lead", c:"keep", d:"direct"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;

let canAnswer = true;

function newGame(){

    life = 9;
    score = 0;
    used = [];
    canAnswer = true;

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}

function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}

function speakAnswer(){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    let text = current.a;

    let utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{

        id =
            Math.floor(
                Math.random() * maxQ
            );

    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];

    canAnswer = true;


    document
        .getElementById("category")
        .innerText = current.cat;


    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    let input =
        document.getElementById("answerInput");

    input.value = "";

    input.disabled = false;

    input.focus();


    document
        .getElementById("checkButton")
        .disabled = false;


    document
        .getElementById("result")
        .innerText = "";


    document
        .getElementById("result")
        .className = "";



    setTimeout(
        () => speakAnswer(),
        300
    );

}

function checkAnswer(){

    if(!canAnswer){
        return;
    }

    let input =
        document.getElementById("answerInput");

    let userAnswer =
        input.value.trim();

    if(userAnswer === ""){
        input.focus();
        return;
    }


    canAnswer = false;

    input.disabled = true;

    document
        .getElementById("checkButton")
        .disabled = true;



    let user =
        userAnswer.toLowerCase();

    let correctAnswer =
        current.a.trim().toLowerCase();


    if(user === correctAnswer){

        correctAnswerAction();

    }else{

        wrongAnswerAction();

    }

}


function correctAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "✅ <b>Poprawnie!</b>";

    document
        .getElementById("result")
        .className =
        "resultCorrect";


    score++;


    dawid108 =
        parseInt(dawid108) + 9;

    localStorage.setItem(
        "dawid108",
        dawid108
    );


    angielski =
        parseInt(angielski) + 9;

    localStorage.setItem(
        "angielski",
        angielski
    );


    updateStats();


    setTimeout(
        () => nextQuestion(),
        1500
    );

}


function wrongAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "❌ <b>Źle!</b><br>" +
        "Poprawna odpowiedź: <strong>" +
        current.a +
        "</strong>";


    document
        .getElementById("result")
        .className =
        "resultWrong";


    life--;

    updateStats();


    setTimeout(
        () => speakAnswer(),
        500
    );


    if(life <= 0){

        setTimeout(
            () => gameOver(),
            6000
        );

    }else{

        setTimeout(
            () => nextQuestion(),
            5000
        );

    }

}


document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                checkAnswer();
            }

        }
    );


function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}



function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
