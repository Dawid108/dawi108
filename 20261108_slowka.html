<head>

<body>

<div id="game">

    <div id="stats">
        <div>Życia: <span id="life">9</span></div>
        <div>Punkty: <span id="score">0</span></div>
    </div>

    <div class="category" id="category"></div>

    <div class="question" id="question"></div>

    <!-- WPISYWANIE ODPOWIEDZI -->
    <div id="answers">

        <input
            type="text"
            id="answerInput"
            placeholder="Wpisz słówko po angielsku"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <button
            id="checkButton"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>

    </div>

    <div id="result"></div>

    <div id="counter"></div>

</div>


<div id="endScreen" class="hidden">

    <h2 id="endTitle"></h2>

    <p>
        Twój wynik:
        <span id="finalScore"></span>
    </p>

    <p>
        Twój rekord:
        <span id="record"></span>
    </p>

    <p>
        Suma punktów:
        <span id="dawid108"></span>
    </p>

    <button onclick="newGame()">
        Nowa Gra
    </button>

</div>

  {cat:"Angielski", q:"pogodzić się, zawierać pokój", a:"make peace", b:"take place", c:"lose price", d:"keep proof"},
  {cat:"Angielski", q:"nieszczęśliwy, żałosny", a:"miserable", b:"marvelous", c:"mysterious", d:"monotonous"},

  {cat:"Angielski", q:"edukacja obywatelska", a:"citizenship education", b:"community connection", c:"competitive election", d:"commercial exhibition"},

  {cat:"Angielski", q:"absurdalny, niedorzeczny", a:"ridiculous", b:"mischievous", c:"prestigious", d:"courageous"},
  {cat:"Angielski", q:"doroczny, coroczny", a:"annual", b:"manual", c:"casual", d:"formal"},
  {cat:"Angielski", q:"kredyt hipoteczny, hipoteka", a:"mortgage", b:"message", c:"manage", d:"package"},
  {cat:"Angielski", q:"giełda (papierów wartościowych)", a:"stock market", b:"state museum", c:"store manager", d:"street monster"},
  {cat:"Angielski", q:"przeznaczyć coś na coś, wziąć coś pod uwagę", a:"allow something for sb/sth", b:"arrange something for sb/sth", c:"attend something for sb/sth", d:"achieve something for sb/sth"},
  {cat:"Angielski", q:"atakować, napadać, krytykować", a:"attack", b:"appeal", c:"attend", d:"admire"},
  {cat:"Angielski", q:"zostać obciążonym (opłatą)", a:"be charged for", b:"be blamed for", c:"be thanked for", d:"be judged for"},
  {cat:"Angielski", q:"kosztować", a:"cost", b:"cast", c:"case", d:"cart"},
  {cat:"Angielski", q:"przypłacać życiem, pociągać za sobą ofiary", a:"cost lives", b:"lose lines", c:"past times", d:"fast drives"},
  {cat:"Angielski", q:"obradować w jakiejś sprawie", a:"debate an issue", b:"design an office", c:"deliver an order", d:"detect an error"},
  {cat:"Angielski", q:"wchodzić", a:"enter", b:"offer", c:"order", d:"upper"},
  {cat:"Angielski", q:"walczyć, kłócić się", a:"fight", b:"sight", c:"night", d:"right"},
  {cat:"Angielski", q:"formować rząd", a:"form a government", b:"find a generation", c:"face a grievance", d:"feel a guidance"},
  {cat:"Angielski", q:"organizować wybory powszechne", a:"hold a general election", b:"hand a global direction", c:"hear a green emotion", d:"help a great evolution"},
  {cat:"Angielski", q:"informować", a:"inform", b:"insist", c:"invite", d:"intend"},
  {cat:"Angielski", q:"najeżdżać (tłumnie) jakieś miejsce / kraj", a:"invade a place / a country", b:"inspect a part / a county", c:"include a path / a canopy", d:"install a pose / a clinic"},
  {cat:"Angielski", q:"zajmować umysł / okupować terytorium", a:"occupy your mind / a territory", b:"oppose your mood / a tendency", c:"obtain your mark / a teamwork", d:"observe your mate / a treasure"},
  {cat:"Angielski", q:"uchwalać ustawę, ustanawiać prawo", a:"pass a law", b:"pick a lot", c:"play a lag", d:"push a leg"},
  {cat:"Angielski", q:"proponowana ustawa", a:"proposed legislation", b:"protected limitation", c:"produced liberation", d:"provided location"},
  {cat:"Angielski", q:"spowodować coś", a:"result in", b:"resist on", c:"reduce up", d:"remove at"},
  {cat:"Angielski", q:"ubiegać się o urządy przez kadencję", a:"serve a term of office", b:"save a team of officers", c:"send a tale of offers", d:"seek a type of optics"},
  {cat:"Angielski", q:"ubiegać się o drugą kadencję", a:"stand for re-election", b:"start for re-direction", c:"stay for re-collection", d:"step for re-connection"},
  {cat:"Angielski", q:"poddawać się", a:"surrender", b:"successor", c:"supporter", d:"suspender"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;

let canAnswer = true;

function newGame(){

    life = 9;
    score = 0;
    used = [];
    canAnswer = true;

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}

function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}

function speakAnswer(){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    let text = current.a;

    let utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{

        id =
            Math.floor(
                Math.random() * maxQ
            );

    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];

    canAnswer = true;


    document
        .getElementById("category")
        .innerText = current.cat;


    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    let input =
        document.getElementById("answerInput");

    input.value = "";

    input.disabled = false;

    input.focus();


    document
        .getElementById("checkButton")
        .disabled = false;


    document
        .getElementById("result")
        .innerText = "";


    document
        .getElementById("result")
        .className = "";



    setTimeout(
        () => speakAnswer(),
        300
    );

}

function checkAnswer(){

    if(!canAnswer){
        return;
    }

    let input =
        document.getElementById("answerInput");

    let userAnswer =
        input.value.trim();

    if(userAnswer === ""){
        input.focus();
        return;
    }


    canAnswer = false;

    input.disabled = true;

    document
        .getElementById("checkButton")
        .disabled = true;



    let user =
        userAnswer.toLowerCase();

    let correctAnswer =
        current.a.trim().toLowerCase();


    if(user === correctAnswer){

        correctAnswerAction();

    }else{

        wrongAnswerAction();

    }

}


function correctAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "✅ <b>Poprawnie!</b>";

    document
        .getElementById("result")
        .className =
        "resultCorrect";


    score++;


    dawid108 =
        parseInt(dawid108) + 11;

    localStorage.setItem(
        "dawid108",
        dawid108
    );


    angielski =
        parseInt(angielski) + 11;

    localStorage.setItem(
        "angielski",
        angielski
    );


    updateStats();


    setTimeout(
        () => nextQuestion(),
        1500
    );

}


function wrongAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "❌ <b>Źle!</b><br>" +
        "Poprawna odpowiedź: <strong>" +
        current.a +
        "</strong>";


    document
        .getElementById("result")
        .className =
        "resultWrong";


    life--;

    updateStats();


    setTimeout(
        () => speakAnswer(),
        500
    );


    if(life <= 0){

        setTimeout(
            () => gameOver(),
            6000
        );

    }else{

        setTimeout(
            () => nextQuestion(),
            5000
        );

    }

}


document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                checkAnswer();
            }

        }
    );


function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}



function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
