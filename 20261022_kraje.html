<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Amerika?", a:"amerikanisch", b:"schwedisch", c:"japanisch", d:"spanisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: China?", a:"chinesisch", b:"israelisch", c:"spanisch", d:"russisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Deutschland?", a:"deutsch", b:"britisch", c:"polnisch", d:"ungarisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: England?", a:"englisch", b:"spanisch", c:"russisch", d:"japanisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Frankreich?", a:"französisch", b:"schwedisch", c:"amerikanisch", d:"italienisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Großbritannien?", a:"britisch", b:"deutsch", c:"spanisch", d:"russisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Italien?", a:"italienisch", b:"französisch", c:"chinesisch", d:"österreichisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Israel?", a:"israelisch", b:"amerikanisch", c:"schwedisch", d:"ungarisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Japan?", a:"japanisch", b:"britisch", c:"italienisch", d:"polnisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Österreich?", a:"österreichisch", b:"französisch", c:"chinesisch", d:"israelisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Polen?", a:"polnisch", b:"deutsch", c:"spanisch", d:"russisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Russland?", a:"russisch", b:"japanisch", c:"britisch", d:"schwedisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Schweden?", a:"schwedisch", b:"ungarisch", c:"französisch", d:"italienisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Spanien?", a:"spanisch", b:"israelisch", c:"amerikanisch", d:"deutsch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: Ungarn?", a:"ungarisch", b:"chinesisch", c:"österreichisch", d:"britisch"},
  {cat:"Niemiecki", q:"Jakie jest przymiotnikowe określenie narodowości od nazwy kraju: die USA?", a:"amerikanisch", b:"französisch", c:"schwedisch", d:"italienisch"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: polnish?", a:"polski", b:"węgierski", c:"rosyjski", d:"szwedzki"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: osterreichish?", a:"austriacki", b:"brytyjski", c:"francuski", d:"włoski"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: franzosisch?", a:"francuski", b:"niemiecki", c:"chiński", d:"hiszpański"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: britisch?", a:"brytyjski", b:"japoński", c:"izraelski", d:"amerykański"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: italienisch?", a:"włoski", b:"polski", c:"szwedzki", d:"rosyjski"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: englisch?", a:"angielski", b:"węgierski", c:"austriacki", d:"hiszpański"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: deutsch?", a:"niemiecki", b:"chiński", c:"brytyjski", d:"francuski"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: chinesisch?", a:"chiński", b:"japoński", c:"izraelski", d:"amerykański"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: schwedisch?", a:"szwedzki", b:"rosyjski", c:"włoski", d:"polski"},
  {cat:"Niemiecki", q:"Co oznacza niemieckie słowo: ungarisch?", a:"węgierski", b:"angielski", c:"austriacki", d:"hiszpański"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let niemiecki =
    localStorage.getItem("niemiecki") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        niemiecki =
            parseInt(niemiecki) + 10;

        localStorage.setItem(
            "niemiecki",
            niemiecki
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
