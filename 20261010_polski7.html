<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

// 7. Budowa dramatu
{cat:"Polski", q:"Kto jest autorem „Wesela”?", a:"Stanisław Wyspiański", b:"Adam Mickiewicz", c:"Juliusz Słowacki", d:"Aleksander Fredro"},
{cat:"Polski", q:"Do jakiego rodzaju literackiego należy „Wesele”?", a:"Do dramatu", b:"Do epiki", c:"Do liryki", d:"Do publicystyki"},
{cat:"Polski", q:"Jaki gatunek najlepiej opisuje „Wesele”?", a:"Dramat symboliczny z elementami realizmu i fantastyki", b:"Powieść historyczna z elementami reportażu", c:"Liryczny poemat o podróżach i przyrodzie", d:"Komedia obyczajowa pozbawiona symboliki"},
{cat:"Polski", q:"Z ilu aktów składa się „Wesele”?", a:"Z trzech aktów", b:"Z dwóch aktów", c:"Z czterech aktów", d:"Z pięciu aktów"},
{cat:"Polski", q:"Co przedstawia akt I „Wesela”?", a:"Rozmowy gości weselnych i relacje społeczne", b:"Wyłącznie pojawienie się wszystkich zjaw", c:"Przygotowania do powstania i utratę złotego rogu", d:"Końcowy chocholi taniec wszystkich weselników"},
{cat:"Polski", q:"Co przedstawia akt II „Wesela”?", a:"Pojawienie się zjaw i ujawnienie problemów bohaterów", b:"Wyłącznie rozmowy o codziennych pracach w gospodarstwie", c:"Początek wesela i pierwszą rozmowę Czepca z Dziennikarzem", d:"Udane powstanie oraz zwycięstwo narodu polskiego"},
{cat:"Polski", q:"Co przedstawia akt III „Wesela”?", a:"Przygotowania do powstania, utratę rogu i chocholi taniec", b:"Wyłącznie pierwsze spotkania i rozmowy gości weselnych", c:"Tylko pojawienie się Widma i wspomnienia Marysi", d:"Wspólne świętowanie zwycięstwa i odzyskania wolności"},
{cat:"Polski", q:"Co łączy się w budowie „Wesela”?", a:"Elementy realistyczne, fantastyczne i symboliczne", b:"Wyłącznie elementy dokumentalne i naukowe", c:"Wyłącznie sceny historyczne bez świata fantastycznego", d:"Tylko opisy przyrody i osobiste wspomnienia bohaterów"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 10;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
