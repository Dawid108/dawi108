<script>
(function () {
    let id108 = localStorage.getItem("id108");

    if (
        !id108 ||
        isNaN(id108)
    ) {
        id108 =
        Math.floor(Math.random() * 9999) + 1;
    
        localStorage.setItem(
            "id108",
            id108
        );
    }

    const isDesktop =
        !window.matchMedia("(pointer: coarse)").matches &&
        window.innerWidth > 900;

    if (isDesktop) {
        console.log("Brak tabeli na komputerach");
        return;
    }
    let dawid108 = localStorage.getItem("dawid108");

        // ZMIENNE DLA GIER
    let biologia = localStorage.getItem("biologia") || 0;
    let chemia = localStorage.getItem("chemia") || 0;
    let fizyka = localStorage.getItem("fizyka") || 0;
    let geografia = localStorage.getItem("geografia") || 0;
    let historia = localStorage.getItem("historia") || 0;
    let angielski = localStorage.getItem("angielski") || 0;
    let niemiecki = localStorage.getItem("niemiecki") || 0;
    let polski = localStorage.getItem("polski") || 0;
    let matematyka = localStorage.getItem("matematyka") || 0;
    let programowanie = localStorage.getItem("programowanie") || 0;

    let url = "https://dawid108.infinityfree.me/szkola.html"
        + "?dawid108=" + encodeURIComponent(dawid108)
        + "&id108=" + encodeURIComponent(id108)
        + "&biologia=" + encodeURIComponent(biologia)
        + "&chemia=" + encodeURIComponent(chemia)
        + "&fizyka=" + encodeURIComponent(fizyka)
        + "&geografia=" + encodeURIComponent(geografia)
        + "&historia=" + encodeURIComponent(historia)
        + "&angielski=" + encodeURIComponent(angielski)
        + "&niemiecki=" + encodeURIComponent(niemiecki)
        + "&polski=" + encodeURIComponent(polski)
        + "&matematyka=" + encodeURIComponent(matematyka)
        + "&programowanie=" + encodeURIComponent(programowanie);

    if (!sessionStorage.getItem("sentToInfinity")) {
        sessionStorage.setItem("sentToInfinity", "1");
        window.location.href = url;
    }
})();
</script>
