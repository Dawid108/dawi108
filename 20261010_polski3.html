<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

// 3. Symbole
{cat:"Polski", q:"Czym jest symbol?", a:"Elementem mającym znaczenie dosłowne i ukryte", b:"Elementem, który ma wyłącznie znaczenie dosłowne", c:"Wypowiedzią, która nie ma żadnego dodatkowego znaczenia", d:"Opisem wydarzenia pozbawionym znaczeń przenośnych"},
{cat:"Polski", q:"Co symbolizuje złoty róg?", a:"Wezwanie do walki i szansę na odzyskanie wolności", b:"Próżność oraz przywiązanie do ozdób i własności", c:"Historyczne krzywdy wyrządzone chłopom przez szlachtę", d:"Uśpienie narodu i brak zdolności do działania"},
{cat:"Polski", q:"Co symbolizuje czapka z pawimi piórami?", a:"Próżność i przywiązanie do własności, przez które Jasiek gubi róg", b:"Gotowość wszystkich Polaków do wspólnej walki", c:"Mądrość polityczną i odpowiedzialność za ojczyznę", d:"Zwycięstwo chłopów nad dawną polską szlachtą"},
{cat:"Polski", q:"Co symbolizuje Chochoł?", a:"Uśpienie narodu, ale również nadzieję na odrodzenie", b:"Wyłącznie zwycięstwo Polaków w walce o wolność", c:"Historyczną zdradę szlachty podczas powstania", d:"Całkowite pojednanie wszystkich grup społecznych"},
{cat:"Polski", q:"Co symbolizuje chocholi taniec?", a:"Bezwład, marazm i niezdolność Polaków do działania", b:"Radosne zwycięstwo narodu po udanym powstaniu", c:"Ostateczne pojednanie chłopów z dawną szlachtą", d:"Gotowość bohaterów do rozpoczęcia walki zbrojnej"},
{cat:"Polski", q:"Co symbolizuje złota podkowa?", a:"Szczęście i szansę na powodzenie", b:"Zdradę narodową oraz historyczne winy szlachty", c:"Utracony patriotyzm i brak zainteresowania polityką", d:"Niezdolność chłopów do zachowania tradycji ludowych"},
{cat:"Polski", q:"Z jakim bohaterem związany jest kaduceusz?", a:"Ze Stańczykiem, który przekazuje go Dziennikarzowi", b:"Z Wernyhorą, który przekazuje go Gospodarzowi", c:"Z Rycerzem, który przekazuje go Poecie", d:"Z Upiorem, który przekazuje go Dziadowi"},
{cat:"Polski", q:"Co może oznaczać kaduceusz w „Weselu”?", a:"Wpływ polityczny i krytykę politycznej bierności", b:"Szansę na rozpoczęcie walki za pomocą złotego rogu", c:"Historyczne krzywdy chłopów podczas rabacji galicyjskiej", d:"Nadzieję na odrodzenie ukrytą w słomianym chochole"},
{cat:"Polski", q:"Co miał zrobić Jasiek za pomocą sznura?", a:"Dzwonić na alarm, zgodnie z otrzymanym zadaniem", b:"Przywiązać złoty róg do weselnego stołu", c:"Związać wszystkich gości przed rozpoczęciem powstania", d:"Przywiązać czapkę z pawimi piórami do chochoła"},
{cat:"Polski", q:"Dlaczego Jasiek zgubił złoty róg?", a:"Schylił się po czapkę z pawimi piórami", b:"Przekazał go Dziennikarzowi podczas rozmowy", c:"Oddał go Wernyhorze przed przybyciem weselników", d:"Zostawił go na stole podczas pierwszego tańca"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 10;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
