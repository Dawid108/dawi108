<body>

    <div id="game">

        <div id="stats">

            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA

{cat:"Polski", q:"Kto pracuje jako parobcy w gospodarstwie Macieja?", a:"Kuba i Witek", b:"Antek i Maciej", c:"Hanka i Jagna", d:"Dominikowa i organista"},

{cat:"Polski", q:"Jak nazywana jest wspólnota mieszkańców Lipiec?", a:"Gromadą", b:"Radą", c:"Armią", d:"Rodziną"},
{cat:"Polski", q:"Kto ma największy szacunek i wpływy w Lipcach?", a:"Najbogatsi gospodarze, tacy jak Maciej Boryna", b:"Najbiedniejsi parobcy, tacy jak Kuba i Witek", c:"Młode dziewczęta, takie jak Jagna i Hanka", d:"Przyjezdni kupcy i pracownicy dworu"},
{cat:"Polski", q:"Jakie zwyczaje przestrzegają mieszkańcy Lipiec?", a:"Swaty, wesela, oczepiny i Zaduszki", b:"Turnieje rycerskie, koronacje i bale dworskie", c:"Wybory, festiwale filmowe i targi przemysłowe", d:"Podróże zagraniczne, koncerty i zawody sportowe"},
{cat:"Polski", q:"Na czym polega solidarność mieszkańców Lipiec?", a:"Potrafią zjednoczyć się w obronie wspólnych interesów, np. lasu", b:"Każdy mieszkaniec dba wyłącznie o własny majątek", c:"Najbogatsi mieszkańcy unikają kontaktów z biednymi", d:"Wszyscy mieszkańcy rywalizują o stanowiska we dworze"},
{cat:"Polski", q:"Na czym polega kontrola społeczna w Lipcach?", a:"Gromada ocenia zachowanie mieszkańców i wymaga przestrzegania zasad moralnych", b:"Każdy mieszkaniec sam ustala zasady dla całej wsi", c:"Dwór kontroluje wyłącznie pracę wszystkich gospodarzy", d:"Organista decyduje o majątku i małżeństwach mieszkańców"},
{cat:"Polski", q:"Gdzie i kiedy rozgrywa się akcja „Chłopów”?", a:"W fikcyjnych Lipcach pod koniec XIX wieku", b:"W Warszawie na początku XVIII wieku", c:"W Krakowie w połowie XX wieku", d:"W Łodzi na początku XXI wieku"},
{cat:"Polski", q:"Ile mniej więcej trwa akcja całej powieści?", a:"Około roku", b:"Około miesiąca", c:"Około pięciu lat", d:"Około dziesięciu lat"},
{cat:"Polski", q:"Od czego zależy życie mieszkańców Lipiec?", a:"Od cyklu przyrody, świąt religijnych i prac rolniczych", b:"Od podróży, handlu zagranicznego i wydarzeń politycznych", c:"Od przemysłu, rozwoju techniki i pracy w fabrykach", d:"Od wojen, zmian granic i decyzji królów"},
{cat:"Polski", q:"Co jest główną podstawą konfliktów w „Chłopach”?", a:"Ziemia, majątek, pieniądze i pozycja społeczna", b:"Religia, podróże, wykształcenie i polityka", c:"Przyroda, pogoda, święta i tradycje", d:"Sztuka, muzyka, literatura i rozrywka"},
{cat:"Polski", q:"Dlaczego ziemia jest tak ważna dla chłopów?", a:"Zapewnia utrzymanie, majątek i szacunek we wsi", b:"Zapewnia wykształcenie, podróże i możliwość sławy", c:"Zapewnia stanowisko w kościele i władzę we dworze", d:"Zapewnia rozrywkę, odpoczynek i życie bez pracy"},
{cat:"Polski", q:"Jakie są skutki konfliktu Macieja i Antka?", a:"Rozpad więzi rodzinnych, wyrzucenie Antka i Hanki oraz utrata wsparcia ojca", b:"Pojednanie rodziny, przekazanie ziemi i wspólne prowadzenie gospodarstwa", c:"Wyjazd Jagny, przejęcie dworu i zakończenie wszystkich sporów", d:"Poprawa relacji rodzinnych, zdobycie majątku i zgoda mieszkańców"},
{cat:"Polski", q:"Co pokazuje konflikt Macieja i Antka?", a:"Przywiązanie do ziemi i majątku może być ważniejsze niż zgoda rodzinna", b:"Miłość zawsze jest ważniejsza niż wszystkie wartości materialne", c:"Praca na gospodarstwie nie ma wpływu na życie rodzinne", d:"Bogactwo zawsze zapewnia szczęście i zgodę w rodzinie"},
{cat:"Polski", q:"Jak można krótko scharakteryzować Hankę?", a:"Początkowo uległa, później silna i zaradna", b:"Początkowo silna, później słaba i niezaradna", c:"Początkowo bogata, później biedna i wyrachowana", d:"Początkowo spontaniczna, później artystyczna i niezależna"},
{cat:"Polski", q:"Jak można krótko scharakteryzować Macieja Borynę?", a:"Bogaty, dumny, uparty i przywiązany do ziemi", b:"Biedny, nieśmiały, uległy i niezależny od ziemi", c:"Młody, spontaniczny, wrażliwy i artystyczny", d:"Spokojny, łagodny, posłuszny i podporządkowany"},
{cat:"Polski", q:"Jak można krótko scharakteryzować Antka Borynę?", a:"Porywczy, dumny i pragnący niezależności", b:"Nieśmiały, uległy i podporządkowany ojcu", c:"Wyrachowany, spokojny i pozbawiony ambicji", d:"Zaradny, cierpliwy i całkowicie niezależny od ziemi"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let polski =
    localStorage.getItem("polski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 11;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        polski =
            parseInt(polski) + 11;

        localStorage.setItem(
            "polski",
            polski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
