<head>

    <link rel="stylesheet" href="20260323_style.css">

<body>

<div id="game">

    <div id="stats">
        <div>Życia: <span id="life">9</span></div>
        <div>Punkty: <span id="score">0</span></div>
    </div>

    <div class="category" id="category"></div>

    <div class="question" id="question"></div>

    <!-- WPISYWANIE ODPOWIEDZI -->
    <div id="answers">

        <input
            type="text"
            id="answerInput"
            placeholder="Wpisz słówko po angielsku"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <button
            id="checkButton"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>

    </div>

    <div id="result"></div>

    <div id="counter"></div>

</div>


<div id="endScreen" class="hidden">

    <h2 id="endTitle"></h2>

    <p>
        Twój wynik:
        <span id="finalScore"></span>
    </p>

    <p>
        Twój rekord:
        <span id="record"></span>
    </p>

    <p>
        Suma punktów:
        <span id="dawid108"></span>
    </p>

    <button onclick="newGame()">
        Nowa Gra
    </button>

</div>

{cat:"Angielski", q:"partner/partnerka", a:"partner", b:"relative", c:"acquaintance", d:"colleague"},

{cat:"Angielski", q:"siostra bliźniaczka", a:"twin sister", b:"half sister", c:"sister-in-law", d:"stepsister"},

{cat:"Angielski", q:"związek, relacja", a:"relationship", b:"friendship", c:"partnership", d:"acquaintance"},
{cat:"Angielski", q:"romans", a:"romance", b:"friendship", c:"relationship", d:"breakup"},
{cat:"Angielski", q:"rozsiewać plotki", a:"spread rumours", b:"lose touch", c:"patch up the differences", d:"end a relationship"},
{cat:"Angielski", q:"wspierający, pomocny", a:"supportive", b:"manipulative", c:"attractive to sb", d:"unaffected"},
{cat:"Angielski", q:"czas leczy rany", a:"time is a healer", b:"it takes two to tango", c:"with luck", d:"ups and downs"},
{cat:"Angielski", q:"toksyczny", a:"toxic", b:"painful", c:"crippling", d:"manipulative"},
{cat:"Angielski", q:"niedotknięty czymś, niewzruszony", a:"unaffected", b:"devastated", c:"supportive", d:"heartbreaking"},
{cat:"Angielski", q:"nie doceniać", a:"underestimate", b:"misunderstand", c:"overlook", d:"disapprove"},
{cat:"Angielski", q:"wzloty i upadki", a:"ups and downs", b:"long-term", c:"it takes two to tango", d:"time is a healer"},
{cat:"Angielski", q:"pogrążać się w czymś", a:"wallow in sth", b:"lose touch", c:"fall for sb", d:"get on with sb"},
{cat:"Angielski", q:"przy odrobinie szczęścia", a:"with luck", b:"with support", c:"in the long-term", d:"due to a misunderstanding"},
{cat:"Angielski", q:"niespokojne myśli", a:"anxious thoughts", b:"ups and downs", c:"painful memories", d:"deep emotions"},
{cat:"Angielski", q:"pociągający, atrakcyjny dla kogoś", a:"attractive to sb", b:"supportive of sb", c:"close to sb", d:"manipulative towards sb"},
{cat:"Angielski", q:"niezręczny", a:"awkward", b:"grumpy", c:"unaffected", d:"supportive"},
{cat:"Angielski", q:"być z kimś blisko", a:"be close to sb", b:"be married with children", c:"get on with sb", d:"go out together"},
{cat:"Angielski", q:"mieć żonę/męża i dzieci", a:"be married with children", b:"be close to sb", c:"go out together", d:"get on with sb"}
];
    
let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;

let canAnswer = true;

function newGame(){

    life = 9;
    score = 0;
    used = [];
    canAnswer = true;

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}

function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}

function speakAnswer(){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    let text = current.a;

    let utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{

        id =
            Math.floor(
                Math.random() * maxQ
            );

    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];

    canAnswer = true;


    document
        .getElementById("category")
        .innerText = current.cat;


    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    let input =
        document.getElementById("answerInput");

    input.value = "";

    input.disabled = false;

    input.focus();


    document
        .getElementById("checkButton")
        .disabled = false;


    document
        .getElementById("result")
        .innerText = "";


    document
        .getElementById("result")
        .className = "";



    setTimeout(
        () => speakAnswer(),
        300
    );

}

function checkAnswer(){

    if(!canAnswer){
        return;
    }

    let input =
        document.getElementById("answerInput");

    let userAnswer =
        input.value.trim();

    if(userAnswer === ""){
        input.focus();
        return;
    }


    canAnswer = false;

    input.disabled = true;

    document
        .getElementById("checkButton")
        .disabled = true;



    let user =
        userAnswer.toLowerCase();

    let correctAnswer =
        current.a.trim().toLowerCase();


    if(user === correctAnswer){

        correctAnswerAction();

    }else{

        wrongAnswerAction();

    }

}


function correctAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "✅ <b>Poprawnie!</b>";

    document
        .getElementById("result")
        .className =
        "resultCorrect";


    score++;


    dawid108 =
        parseInt(dawid108) + 9;

    localStorage.setItem(
        "dawid108",
        dawid108
    );


    angielski =
        parseInt(angielski) + 9;

    localStorage.setItem(
        "angielski",
        angielski
    );


    updateStats();


    setTimeout(
        () => nextQuestion(),
        1500
    );

}


function wrongAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "❌ <b>Źle!</b><br>" +
        "Poprawna odpowiedź: <strong>" +
        current.a +
        "</strong>";


    document
        .getElementById("result")
        .className =
        "resultWrong";


    life--;

    updateStats();


    setTimeout(
        () => speakAnswer(),
        500
    );


    document
        .getElementById("answerInput")
        .value = "";

    document
        .getElementById("answerInput")
        .focus();


    if(life <= 0){

        setTimeout(
            () => gameOver(),
            6000
        );

    }

}


document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                checkAnswer();
            }

        }
    );


function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}



function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
