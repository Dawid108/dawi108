<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

// 10. Dlaczego nie doszło do powstania?
{cat:"Polski", q:"Jaka była pierwsza przyczyna niepowodzenia planów powstańczych?", a:"Brak jedności narodowej między chłopami a inteligencją", b:"Nadmiar złotych rogów i innych przedmiotów weselnych", c:"Całkowity brak zainteresowania wsią ze strony chłopów", d:"Zbyt duża liczba osób gotowych do wspólnej walki"},
{cat:"Polski", q:"Jaka była druga przyczyna niepowodzenia planów powstańczych?", a:"Brak odpowiedzialności Gospodarza, który przekazał misję Jaśkowi", b:"Odmowa udziału w weselu wszystkich przedstawicieli inteligencji", c:"Zniszczenie chaty bronowickiej przez samego Wernyhorę", d:"Brak zainteresowania polską historią ze strony Chochoła"},
{cat:"Polski", q:"Jaka była trzecia przyczyna niepowodzenia planów powstańczych?", a:"Jasiek zgubił złoty róg, schylając się po czapkę z pawimi piórami", b:"Gospodarz oddał złotą podkowę Stańczykowi podczas rozmowy", c:"Dziennikarz zgubił kaduceusz przed przybyciem Wernyhory", d:"Poeta odmówił przyjęcia czapki od Pana Młodego"},
{cat:"Polski", q:"Co spowodował brak złotego rogu?", a:"Utracono szansę na wezwanie ludzi do walki", b:"Wszyscy weselnicy natychmiast odzyskali wolność", c:"Chłopi i inteligencja ostatecznie się pogodzili", d:"Wernyhora samodzielnie zakończył powstanie zwycięstwem"},
{cat:"Polski", q:"Co dzieje się z weselnikami po zmarnowaniu szansy na powstanie?", a:"Pogrążają się w chocholim tańcu", b:"Rozpoczynają zwycięską walkę o niepodległość", c:"Wspólnie odnajdują złoty róg i przekazują go Gospodarzowi", d:"Wyruszają za Wernyhorą, aby odzyskać złotą podkowę"},
{cat:"Polski", q:"Dlaczego Gospodarz nie dopilnował osobiście misji powstańczej?", a:"Przekazał zadanie Jaśkowi zamiast samemu go dopilnować", b:"Postanowił samodzielnie ukryć złoty róg w chacie", c:"Zdecydował się oddać misję Stańczykowi i Dziennikarzowi", d:"Uznał, że Wernyhora nie przyniósł żadnego ważnego zadania"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 10;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
