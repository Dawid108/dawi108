<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [

// 6. Cytaty i rozpoznawanie bohaterów
{cat:"Polski", q:"Kto mówi: „Cóż tam, panie, w polityce? Chińczyki trzymają się mocno!”?", a:"Czepiec", b:"Dziennikarz", c:"Gospodarz", d:"Pan Młody"},
{cat:"Polski", q:"Kto mówi: „Miałeś, chamie, złoty róg…”?", a:"Chochoł", b:"Czepiec", c:"Poeta", d:"Gospodarz"},
{cat:"Polski", q:"Kto wypowiada słowa: „Chłop potęgą jest i basta.”?", a:"Gospodarz", b:"Dziennikarz", c:"Pan Młody", d:"Czepiec"},
{cat:"Polski", q:"Kto mówi: „Niech na całym świecie wojna, byle polska wieś zaciszna…”?", a:"Dziennikarz", b:"Czepiec", c:"Gospodarz", d:"Poeta"},
{cat:"Polski", q:"Kto wypowiada słowa: „A to Polska właśnie.”?", a:"Gospodarz", b:"Pan Młody", c:"Dziennikarz", d:"Czepiec"},
{cat:"Polski", q:"Kto mówi: „Trza być w butach na weselu.”?", a:"Czepiec", b:"Dziennikarz", c:"Gospodarz", d:"Poeta"},
{cat:"Polski", q:"Kto wypowiada słowa: „Jak się żenić, to się żenić!”?", a:"Pan Młody", b:"Czepiec", c:"Poeta", d:"Dziennikarz"},
{cat:"Polski", q:"Która postać jest chłopem zainteresowanym polityką?", a:"Czepiec", b:"Dziennikarz", c:"Poeta", d:"Gospodarz"},
{cat:"Polski", q:"Która postać jest inteligentem, który poślubił chłopkę i zachwyca się wsią?", a:"Pan Młody", b:"Czepiec", c:"Dziad", d:"Stańczyk"},
{cat:"Polski", q:"Która postać jest przedstawicielem konserwatywnej inteligencji?", a:"Dziennikarz", b:"Czepiec", c:"Jasiek", d:"Upiór"},
{cat:"Polski", q:"Która postać jest artystą i marzycielem z kręgu inteligencji?", a:"Poeta", b:"Czepiec", c:"Dziad", d:"Jasiek"},
{cat:"Polski", q:"Która postać otrzymuje misję od Wernyhory?", a:"Gospodarz", b:"Czepiec", c:"Dziennikarz", d:"Pan Młody"},
{cat:"Polski", q:"Kto wypowiada słowa: „A, ja myślę, że panowie duża by już mogli mieć, ino oni nie chcom chcieć!”?", a:"Czepiec", b:"Dziennikarz", c:"Poeta", d:"Pan Młody"},
{cat:"Polski", q:"Który bohater uosabia chłopa zainteresowanego sprawami publicznymi?", a:"Czepiec", b:"Stańczyk", c:"Hetman", d:"Rycerz"},
{cat:"Polski", q:"Która postać jest gospodarzem wesela i przedstawicielem inteligencji mieszkającym na wsi?", a:"Gospodarz", b:"Dziennikarz", c:"Czepiec", d:"Upiór"},
{cat:"Polski", q:"Który bohater poślubił Pannę Młodą?", a:"Pan Młody", b:"Gospodarz", c:"Dziennikarz", d:"Poeta"},
{cat:"Polski", q:"Kto w dramacie reprezentuje artystów i skłonność do marzeń?", a:"Poeta", b:"Czepiec", c:"Jasiek", d:"Dziad"},
{cat:"Polski", q:"Która postać jest związana z kaduceuszem i politycznymi wyrzutami sumienia?", a:"Stańczyk", b:"Wernyhora", c:"Hetman", d:"Upiór"},
{cat:"Polski", q:"Kto wypowiada słowa: „Miałeś, chamie, złoty róg, miałeś, chamie, czapkę z piór”?", a:"Chochoł", b:"Gospodarz", c:"Czepiec", d:"Dziennikarz"},
{cat:"Polski", q:"Która postać symbolizuje Polskę w słowach „A to Polska właśnie”?", a:"Gospodarz wskazuje na symboliczną wymowę postaci Chochoła", b:"Czepiec wskazuje na złotą podkowę znalezioną w chacie", c:"Dziennikarz wskazuje na kaduceusz przekazany Poecie", d:"Jasiek wskazuje na czapkę z pawimi piórami"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 10;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
