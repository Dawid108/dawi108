<html lang="pl">
<head>

    <link rel="stylesheet" href="20260323_style.css">

</head>

<body>

<div id="game">

    <div id="stats">
        <div>Życia: <span id="life">9</span></div>
        <div>Punkty: <span id="score">0</span></div>
    </div>

    <div class="category" id="category"></div>

    <div class="question" id="question"></div>

    <!-- WPISYWANIE ODPOWIEDZI -->
    <div id="answers">

        <input
            type="text"
            id="answerInput"
            placeholder="Wpisz słówko po angielsku"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <button
            id="checkButton"
            onclick="checkAnswer()"
        >
            Sprawdź
        </button>

    </div>

    <div id="result"></div>

    <div id="counter"></div>

</div>


<div id="endScreen" class="hidden">

    <h2 id="endTitle"></h2>

    <p>
        Twój wynik:
        <span id="finalScore"></span>
    </p>

    <p>
        Twój rekord:
        <span id="record"></span>
    </p>

    <p>
        Suma punktów:
        <span id="dawid108"></span>
    </p>

    <button onclick="newGame()">
        Nowa Gra
    </button>

</div>

  {cat:"Angielski", q:"wyższy urzędnik", a:"official", b:"original", c:"optional", d:"ordinary"},

  {cat:"Angielski", q:"głosować, brać udział w wyborach", a:"vote in an election", b:"run in a campaign", c:"join in a meeting", d:"take in a session"},

  {cat:"Angielski", q:"winić kogoś za coś", a:"blame sb for sth", b:"bring sb to sth", c:"board sb for sth", d:"boost sb with sth"},
  {cat:"Angielski", q:"łamać zasady", a:"break the rules", b:"bend the ropes", c:"beat the rounds", d:"bring the rates"},

  {cat:"Angielski", q:"dopalacze", a:"designer drugs", b:"dangerous drinks", c:"defective drafts", d:"dynamic diodes"},
  {cat:"Angielski", q:"grzywna", a:"fine", b:"fame", c:"fuse", d:"fere"},
  {cat:"Angielski", q:"rozprzestrzeniać się szybko w Internecie", a:"go viral", b:"get brutal", c:"grow fatal", d:"grab formal"},
  {cat:"Angielski", q:"nadążać za kimś/czymś, dotrzymywać komuś kroku", a:"keep up with sb/sth", b:"kick off with sb/sth", c:"knock down with sb/sth", d:"know well with sb/sth"},
  {cat:"Angielski", q:"praworządny", a:"law-abiding", b:"life-changing", c:"long-standing", d:"low-spending"},
  {cat:"Angielski", q:"prowadzić do uzależnienia", a:"lead to addiction", b:"look to admission", c:"leave to affection", d:"limit to attention"},
  {cat:"Angielski", q:"legalne używki", a:"legal highs", b:"local lights", c:"loyal lives", d:"lucid loaves"},
  {cat:"Angielski", q:"delegalizować", a:"make illegal", b:"make illogical", c:"make irregular", d:"make impartial"},
  {cat:"Angielski", q:"ukraść coś, zwędzić", a:"nick sth", b:"note sth", c:"name sth", d:"nurt sth"},
  {cat:"Angielski", q:"przestępca, sprawca", a:"offender", b:"observer", c:"operator", d:"organiser"},
  {cat:"Angielski", q:"petycja", a:"petition", b:"position", c:"provision", d:"pollution"},
  {cat:"Angielski", q:"powstrzymać kogoś przed zrobieniem czegoś", a:"prevent sb from doing sth", b:"protect sb from losing sth", c:"propose sb for taking sth", d:"provide sb with making sth"},
  {cat:"Angielski", q:"protestować przeciwko czemuś", a:"protest against sth", b:"promote around sth", c:"provide above sth", d:"proceed among sth"},
  {cat:"Angielski", q:"karać kogoś za coś", a:"punish sb for sth", b:"pursue sb for sth", c:"praise sb for sth", d:"pause sb for sth"},
  {cat:"Angielski", q:"czysty, nieskażony", a:"pure", b:"pale", c:"plus", d:"post"},
  {cat:"Angielski", q:"zniechęcać kogoś, odstręczać", a:"put sb off", b:"pass sb out", c:"pick sb up", d:"pull sb on"},
  {cat:"Angielski", q:"okazjonalne zażywanie narkotyków", a:"recreational drug use", b:"regional debt crisis", c:"rational plan design", d:"radical trend shift"},
  {cat:"Angielski", q:"prowadzić do czegoś, kończyć się czymś", a:"result in sth", b:"reflect on sth", c:"rely on sth", d:"react to sth"},
  {cat:"Angielski", q:"fotoradar", a:"speed camera", b:"space capsule", c:"smart system", d:"sharp column"},
  {cat:"Angielski", q:"martwić się czymś", a:"worry about sth", b:"wonder about sth", c:"whisper about sth", d:"witness about sth"}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;

let canAnswer = true;

function newGame(){

    life = 9;
    score = 0;
    used = [];
    canAnswer = true;

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}

function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}

function speakAnswer(){

    if(!("speechSynthesis" in window)){
        return;
    }

    speechSynthesis.cancel();

    let text = current.a;

    let utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    utterance.rate = 0.85;

    utterance.pitch = 1;

    speechSynthesis.speak(utterance);
}


function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{

        id =
            Math.floor(
                Math.random() * maxQ
            );

    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];

    canAnswer = true;


    document
        .getElementById("category")
        .innerText = current.cat;


    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    let input =
        document.getElementById("answerInput");

    input.value = "";

    input.disabled = false;

    input.focus();


    document
        .getElementById("checkButton")
        .disabled = false;


    document
        .getElementById("result")
        .innerText = "";


    document
        .getElementById("result")
        .className = "";



    setTimeout(
        () => speakAnswer(),
        300
    );

}

function checkAnswer(){

    if(!canAnswer){
        return;
    }

    let input =
        document.getElementById("answerInput");

    let userAnswer =
        input.value.trim();

    if(userAnswer === ""){
        input.focus();
        return;
    }


    canAnswer = false;

    input.disabled = true;

    document
        .getElementById("checkButton")
        .disabled = true;



    let user =
        userAnswer.toLowerCase();

    let correctAnswer =
        current.a.trim().toLowerCase();


    if(user === correctAnswer){

        correctAnswerAction();

    }else{

        wrongAnswerAction();

    }

}


function correctAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "✅ <b>Poprawnie!</b>";

    document
        .getElementById("result")
        .className =
        "resultCorrect";


    score++;


    dawid108 =
        parseInt(dawid108) + 11;

    localStorage.setItem(
        "dawid108",
        dawid108
    );


    angielski =
        parseInt(angielski) + 11;

    localStorage.setItem(
        "angielski",
        angielski
    );


    updateStats();


    setTimeout(
        () => nextQuestion(),
        1500
    );

}


function wrongAnswerAction(){

    document
        .getElementById("result")
        .innerHTML =
        "❌ <b>Źle!</b><br>" +
        "Poprawna odpowiedź: <strong>" +
        current.a +
        "</strong>";


    document
        .getElementById("result")
        .className =
        "resultWrong";


    life--;

    updateStats();


    setTimeout(
        () => speakAnswer(),
        500
    );


    if(life <= 0){

        setTimeout(
            () => gameOver(),
            6000
        );

    }else{

        setTimeout(
            () => nextQuestion(),
            5000
        );

    }

}


document
    .getElementById("answerInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){
                checkAnswer();
            }

        }
    );


function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}



function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
