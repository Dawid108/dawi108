<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z mikserem (maskulinum)?",
    a: "mit dem Mixer",
    b: "mit dem Computer",
    c: "mit dem Fernseher",
    d: "mit dem Staubsauger"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z suszarką (maskulinum)?",
    a: "mit dem Föhn",
    b: "mit dem Kühlschrank",
    c: "mit dem Ventilator",
    d: "mit dem Rasierer"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z tosterem (maskulinum)?",
    a: "mit dem Toaster",
    b: "mit dem Kalender",
    c: "mit dem Drucker",
    d: "mit dem Stuhl"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z kamerą wideo (femininum)?",
    a: "mit der Videokamera",
    b: "mit der Schreibtisch",
    c: "mit der Wasserkocher",
    d: "mit der Mikrowelle"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z przyciskiem myszy (femininum)?",
    a: "mit der Maustaste",
    b: "mit der Spülmaschine",
    c: "mit der Tastatur",
    d: "mit der Kaffeemaschine"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z latarką (femininum)?",
    a: "mit der Taschenlampe",
    b: "mit der Schreibtischlampe",
    c: "mit der Waschmaschine",
    d: "mit der Steckdose"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z telefonem komórkowym / smartfonem (neutrum)?",
    a: "mit dem Handy",
    b: "mit dem Tablet",
    c: "mit dem Radio",
    d: "mit dem Buch"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z ładowarką (neutrum)?",
    a: "mit dem Ladegerät",
    b: "mit dem Fernsehen",
    c: "mit dem Schlüssel",
    d: "mit dem Gebäude"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z kredkami (plural)?",
    a: "mit den Farbstiften",
    b: "mit den Kugelschreibern",
    c: "mit den Bleistiften",
    d: "mit den Schulranzen"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z aparatem fotograficznym?",
    a: "mit dem Fotoapparat",
    b: "mit dem Laboratorium",
    c: "mit dem Lautsprecher",
    d: "mit dem Bildschirm"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z ekspresem do kawy?",
    a: "mit der Kaffeemaschine",
    b: "mit der Gefrierschrank",
    c: "mit der Schokoladen",
    d: "mit der Briefmarken"
  },
  {
    cat: "Niemiecki",
    q: "Jak powiesz po niemiecku z użyciem przyimka 'mit' (Dativ): z czajnikiem elektrycznym?",
    a: "mit dem Wasserkocher",
    b: "mit dem Staubsauger",
    c: "mit dem Kühlschrank",
    d: "mit dem Geschirr"
  }
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let niemiecki =
    localStorage.getItem("niemiecki") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        niemiecki =
            parseInt(niemiecki) + 10;

        localStorage.setItem(
            "niemiecki",
            niemiecki
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
