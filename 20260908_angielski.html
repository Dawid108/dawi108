    <div id="game">

        </div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>

  },
  {

    q: "Jak przetłumaczyć na angielski zdanie: 'Do następnego tygodnia przeczytam całą książkę'?",
    a: "By next week I will have read the whole book.",
    b: "By next week I will be reading the whole book.",
    c: "Next week I will read the whole book completely.",
    d: "By next week I have read all of the book."
  },
  {

    q: "Jak przetłumaczyć na angielski zdanie: 'Mam nadzieję, że do jutra nauczę się całego wiersza na pamięć'?",
    a: "I hope till tomorrow I will have learnt the whole poem by heart.",
    b: "I hope till tomorrow I will learn the whole poem by heart.",
    c: "I hope tomorrow I am learning the whole poem by heart.",
    d: "I hope till tomorrow I will be learning the whole poem."
  },
  {

    q: "Co oznacza słówko 'the whole'?",
    a: "cała, cały, całe",

  },
  {

    q: "Jak przetłumaczyć na angielski zdanie: 'Napiszę wszystkie maile do końca dnia'?",

    b: "I will write all of emails until the end day.",
    c: "I will be writing all emails by end day.",
    d: "I have written all emails by end day."
  },
  {
    cat: "Angielski",
    q: "Jak przetłumaczyć na angielski zdanie: 'Do 14:00 ugotuję obiad'?",

    b: "I will cook dinner at two p.m. today.",
    c: "I will be cooking dinner by two p.m.",

  {

    q: "Jakie jest polskie tłumaczenie czasu Future Continuous?",
    a: "Czas przyszły ciągły",

    a: "Do czynności, które będą miały miejsce w przyszłości i będą rozciągnięte w czasie (będą trwały długo)",
    b: "Do czynności, które zakończą się całkowicie przed określonym momentem w przyszłości",
    c: "Do jednorazowych i krótkich zdarzeń, które wydarzyły się w przeszłości",

  {

  {

    d: "yesterday, last night, in 1999"
  },
  {

    q: "Jak przetłumaczyć na angielski zdanie: 'Będziemy spać w namiocie całą noc'?",

    b: "We will have slept in the tent all night.",
    c: "We are sleeping in the tent all night long.",
    d: "We will sleep inside tent for whole night."
  },
  {
    cat: "Angielski",
    q: "Jak przetłumaczyć na angielski zdanie: 'Będę uczyć się całą noc'?",
    a: "I will be studying all night.",
    b: "I will have studied all night.",
    c: "I am going to study all night.",
    d: "I will study through all night."
  },
  {
    cat: "Angielski",
    q: "Jak przetłumaczyć na angielski zdanie: 'Będziemy pracować nad tym projektem cały rok'?",
    a: "We will be working on this project all year.",
    b: "We will have worked on this project all year.",
    c: "We will work for this project through whole year.",
    d: "We are working on this project all the year."
  },
  {
    cat: "Angielski",
    q: "Jak przetłumaczyć na angielski zdanie: 'Będzie padać w tej części kraju przez kilka godzin'?",
    a: "It will be raining in this part of the country for a few hours.",
    b: "It will have rained in this part of the country for a few hours.",
    c: "It is raining in this part of country for a few hours.",
    d: "It will rain in this part of the country during few hours."
  }
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 9;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 9;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</html>
