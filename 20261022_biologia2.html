<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [
{cat:"Biologia", q:"Czym jest gen?", a:"Fragment DNA zawierający informację o budowie białka lub RNA.", b:"Fragment białka zawierający informację o budowie DNA.", c:"Podstawowa jednostka budująca błonę komórkową.", d:"Zestaw wszystkich chromosomów znajdujących się w komórce."},
{cat:"Biologia", q:"Czym są eksony?", a:"Fragmenty genu pozostające w dojrzałym RNA.", b:"Fragmenty genu usuwane podczas dojrzewania RNA.", c:"Podstawowe jednostki budujące cząsteczkę DNA.", d:"Fragmenty chromosomów wymieniane podczas mejozy."},
{cat:"Biologia", q:"Czym są introny?", a:"Fragmenty genu usuwane podczas dojrzewania RNA.", b:"Fragmenty genu pozostające w dojrzałym RNA.", c:"Podstawowe jednostki budujące cząsteczkę białka.", d:"Fragmenty chromosomów powstające podczas replikacji DNA."},
{cat:"Biologia", q:"Czym są nukleotydy?", a:"Podstawowe jednostki budujące DNA i RNA.", b:"Podstawowe jednostki budujące białka i enzymy.", c:"Struktury odpowiedzialne za podział chromosomów.", d:"Fragmenty genów usuwane podczas dojrzewania RNA."},
{cat:"Biologia", q:"Czym jest kod genetyczny?", a:"Sposób zapisu informacji o budowie białek za pomocą trójek nukleotydów.", b:"Sposób zapisu informacji o liczbie chromosomów w komórce.", c:"Proces powielania informacji genetycznej przed podziałem komórki.", d:"Sposób wymiany fragmentów chromosomów podczas mejozy."},
{cat:"Biologia", q:"Czym jest fenotyp?", a:"Zespół obserwowalnych cech organizmu zależnych od genów i środowiska.", b:"Zestaw wszystkich genów zawartych w komórkach danego organizmu.", c:"Zestaw wszystkich chromosomów charakterystycznych dla organizmu.", d:"Zbiór wszystkich alleli występujących w jednej populacji."},
{cat:"Biologia", q:"Czym jest genotyp?", a:"Zestaw informacji genetycznej organizmu.", b:"Zespół obserwowalnych cech organizmu.", c:"Zestaw wszystkich chromosomów w komórce.", d:"Zespół cech organizmu zależnych wyłącznie od środowiska."},
{cat:"Biologia", q:"Czym jest kariotyp?", a:"Zestaw wszystkich chromosomów w komórce organizmu.", b:"Zestaw wszystkich genów odpowiedzialnych za jedną cechę.", c:"Zespół wszystkich widocznych cech danego organizmu.", d:"Zestaw nukleotydów budujących pojedynczy gen."},
{cat:"Biologia", q:"Czym jest allel?", a:"Jedna z wersji tego samego genu.", b:"Jedna z jednostek budujących cząsteczkę DNA.", c:"Jeden z chromosomów występujących w kariotypie.", d:"Jedna z trójek nukleotydów kodujących aminokwas."},
{cat:"Biologia", q:"Czym jest allel dominujący?", a:"Allel ujawniający swoją cechę także w obecności allelu recesywnego.", b:"Allel ujawniający swoją cechę wyłącznie w dwóch kopiach.", c:"Allel, który zawsze zanika podczas podziału komórki.", d:"Allel, który występuje tylko w komórkach rozrodczych."},
{cat:"Biologia", q:"Czym jest allel recesywny?", a:"Allel, którego cecha ujawnia się zazwyczaj przy dwóch jego kopiach.", b:"Allel, którego cecha zawsze ujawnia się przy jednej kopii.", c:"Allel, który odpowiada za powielanie całej cząsteczki DNA.", d:"Allel, który występuje wyłącznie w chromosomach płciowych."},
{cat:"Biologia", q:"Czym jest homozygota?", a:"Organizm mający dwa takie same allele danego genu, np. AA lub aa.", b:"Organizm mający dwa różne allele danego genu, np. Aa.", c:"Organizm posiadający tylko jeden chromosom w każdej komórce.", d:"Organizm mający dwie różne wersje wszystkich swoich genów."},
{cat:"Biologia", q:"Czym jest heterozygota?", a:"Organizm mający dwa różne allele danego genu, np. Aa.", b:"Organizm mający dwa takie same allele danego genu, np. AA.", c:"Organizm posiadający dwa identyczne zestawy chromosomów.", d:"Organizm, którego wszystkie cechy zależą wyłącznie od środowiska."},
{cat:"Biologia", q:"Czym zajmuje się genetyka?", a:"Badaniem dziedziczenia cech i zmienności organizmów.", b:"Badaniem budowy skał oraz procesów zachodzących we wnętrzu Ziemi.", c:"Badaniem zależności między organizmami a ich środowiskiem.", d:"Badaniem budowy narządów i układów ciała człowieka."},
{cat:"Biologia", q:"Na czym polega crossing-over?", a:"Na wymianie fragmentów chromatyd chromosomów homologicznych podczas mejozy.", b:"Na powielaniu całej cząsteczki DNA przed podziałem komórki.", c:"Na usuwaniu intronów z RNA podczas dojrzewania cząsteczki.", d:"Na rozdzielaniu alleli do komórek podczas każdego podziału."},
{cat:"Biologia", q:"Czym jest replikacja DNA?", a:"Procesem powielania DNA, w wyniku którego powstają dwie identyczne cząsteczki.", b:"Procesem wymiany fragmentów chromatyd chromosomów homologicznych.", c:"Procesem usuwania niekodujących fragmentów genu z RNA.", d:"Procesem tworzenia białek na podstawie informacji z mRNA."}
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let biologia =
    localStorage.getItem("biologia") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 10;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        biologia =
            parseInt(biologia) + 10;

        localStorage.setItem(
            "biologia",
            biologia
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
