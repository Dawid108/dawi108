<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szkoła</title>
    <link rel="icon" href="dawi108.png" type="image/png">
    <link rel="manifest" href="20251203_manifest.json">
    <link rel="stylesheet" href="20260323_style.css">
    <script src="script.js"></script>
</head>

<body>

    <div id="game">

        <div id="stats">
            <div>Życia: <span id="life">9</span></div>
            <div>Punkty: <span id="score">0</span></div>
        </div>

        <div class="category" id="category"></div>

        <div class="question" id="question"></div>

        <div id="answers"></div>

        <div id="counter"></div>

    </div>


    <div id="endScreen" class="hidden">

        <h2 id="endTitle"></h2>

        <p>
            Twój wynik:
            <span id="finalScore"></span>
        </p>

        <p>
            Twój rekord:
            <span id="record"></span>
        </p>

        <p>
            Suma punktów:
            <span id="dawid108"></span>
        </p>

        <button onclick="newGame()">
            Nowa Gra
        </button>

    </div>


<script>

// PYTANIA
let questions = [
{cat:"Angielski", q:"They ______ (drive) to New York tomorrow morning.", a:"are driving", b:"will drive", c:"are going to drive", d:"will be driving"},

{cat:"Angielski", q:"I hope the weather ______ (be) nice.", a:"will be", b:"is going to be", c:"is being", d:"will being"},

{cat:"Angielski", q:"I offered him this job. I think he ______ (take) it.", a:"will take", b:"is taking", c:"is going to take", d:"will taking"},

{cat:"Angielski", q:"I promise I ______ (not tell) your secret to anyone.", a:"won't tell", b:"am not telling", c:"am not going to tell", d:"will not telling"},

{cat:"Angielski", q:"Take your umbrella with you. It ______ (rain).", a:"is going to rain", b:"will rain", c:"is raining", d:"will be rain"},

{cat:"Angielski", q:"They ______ (play) cards this evening.", a:"are playing", b:"will play", c:"are going to play", d:"will be play"},

{cat:"Angielski", q:"I ______ (go) to the cinema tomorrow.", a:"am going", b:"am going to go", c:"will go", d:"will going"},

{cat:"Angielski", q:"They ______ (fly) to Seattle next summer holidays.", a:"are going to fly", b:"will fly", c:"are flying", d:"will be fly"},

{cat:"Angielski", q:"I ______ (invite) 50 people to the party, and I hope everyone ______ (come).", a:"am going to invite / will come", b:"will invite / will come", c:"am inviting / is coming", d:"will inviting / will coming"},

{cat:"Angielski", q:"That exercise looks difficult. I ______ (help) you.", a:"will help", b:"am helping", c:"am going to help", d:"will helping"},

{cat:"Angielski", q:"______ he ______ (go) to the football match?", a:"Is / going to go", b:"Will / going", c:"Is / going", d:"Will / goes"},

{cat:"Angielski", q:"Are you sure they ______ (win) the match?", a:"will win", b:"are winning", c:"are going win", d:"will winning"},

{cat:"Angielski", q:"She ______ probably ______ (stay) till Thursday.", a:"will / stay", b:"is / staying", c:"is / going stay", d:"will / staying"},

{cat:"Angielski", q:"He ______ (not leave) tomorrow.", a:"isn't leaving", b:"will not leave", c:"is not going leave", d:"will not leaving"},

{cat:"Angielski", q:"We think he ______ (come) home late in the night.", a:"will come", b:"is coming", c:"is going come", d:"will coming"}
  
];

let current = 0;
let life = 9;
let score = 0;
let used = [];
let maxQ = questions.length;

let record =
    localStorage.getItem("szkola") || 0;

let dawid108 =
    localStorage.getItem("dawid108") || 0;

let angielski =
    localStorage.getItem("angielski") || 0;


// NOWA GRA
function newGame(){

    life = 9;
    score = 0;
    used = [];

    document
        .getElementById("endScreen")
        .classList.add("hidden");

    document
        .getElementById("game")
        .classList.remove("hidden");

    updateStats();

    nextQuestion();
}


// AKTUALIZACJA STATYSTYK
function updateStats(){

    document.getElementById("life").innerText = life;

    document.getElementById("score").innerText = score;

}


// NASTĘPNE PYTANIE
function nextQuestion(){

    if(used.length === maxQ){
        return win();
    }

    let id;

    do{
        id =
            Math.floor(
                Math.random() * maxQ
            );
    }

    while(used.includes(id));

    used.push(id);

    current = questions[id];


    document
        .getElementById("category")
        .innerText = current.cat;

    document
        .getElementById("question")
        .innerText = current.q;


    document
        .getElementById("counter")
        .innerText =
        "Pytanie " +
        used.length +
        " / " +
        maxQ;


    // Mieszanie odpowiedzi

    let arr = [

        {
            txt: current.a,
            correct: true
        },

        {
            txt: current.b,
            correct: false
        },

        {
            txt: current.c,
            correct: false
        },

        {
            txt: current.d,
            correct: false
        }

    ];


    arr.sort(
        () => Math.random() - 0.5
    );


    let ansDiv =
        document.getElementById("answers");

    ansDiv.innerHTML = "";


    arr.forEach(a => {

        let btn =
            document.createElement("div");

        btn.classList.add("btn");

        btn.innerText = a.txt;

        btn.onclick =
            () => answer(a.correct, btn);

        ansDiv.appendChild(btn);

    });

}


// ODPOWIEDŹ
function answer(correct, btn){

    let buttons =
        document.querySelectorAll(".btn");

    buttons.forEach(
        b => b.style.pointerEvents = "none"
    );


    if(correct){

        btn.classList.add("correct");

        score++;


        dawid108 =
            parseInt(dawid108) + 9;

        localStorage.setItem(
            "dawid108",
            dawid108
        );


        angielski =
            parseInt(angielski) + 9;

        localStorage.setItem(
            "angielski",
            angielski
        );


        updateStats();


        setTimeout(
            () => nextQuestion(),
            1500
        );


    }else{

        btn.classList.add("wrong");


        // Pokaż poprawną odpowiedź

        buttons.forEach(b => {

            if(
                b.innerText === current.a
            ){
                b.classList.add("correct");
            }

        });


        life--;

        updateStats();


        if(life <= 0){

            setTimeout(
                () => gameOver(),
                6000
            );

        }else{

            setTimeout(
                () => nextQuestion(),
                5000
            );

        }

    }

}


// WYGRANA
function win(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Wygrałeś!";

    endScreen();

}


// KONIEC GRY
function gameOver(){

    document
        .getElementById("game")
        .classList.add("hidden");

    document
        .getElementById("endScreen")
        .classList.remove("hidden");

    document
        .getElementById("endTitle")
        .innerText =
        "Koniec gry";

    endScreen();

}


// EKRAN KOŃCOWY
function endScreen(){

    document
        .getElementById("finalScore")
        .innerText = score;


    if(score > record){

        record = score;

        localStorage.setItem(
            "szkola",
            record
        );

    }


    document
        .getElementById("record")
        .innerText = record;


    document
        .getElementById("dawid108")
        .innerText = dawid108;

}


newGame();

</script>

</body>
</html>
